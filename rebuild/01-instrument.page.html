  caseBox.innerHTML=caseHtml(d);
  caseBox.classList.add('open');
  setSiblings(true);
  if(!caseFromLink){
    try{var u=new URL(location.href);u.searchParams.set('case',id);
      history.pushState({rrcase:id},'',u.pathname+u.search);casePushed=true;}catch(e){}}
  RR_TRAP=function(e){
    if(e.key==='Escape'){e.preventDefault();closeCase();return;}
    if(e.key!=='Tab')return;
    var f=Array.prototype.slice.call(caseBox.querySelectorAll('button,[href],[tabindex="0"],input,select,textarea'))
      .filter(function(el){return !el.disabled&&el.offsetParent!==null;});
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}};
  document.addEventListener('keydown',RR_TRAP,true);
  var panel=caseBox.querySelector('.case-panel');
  setTimeout(function(){if(panel)panel.focus();},30);
  renderTail();}
function rrFetchOne(id,cb){
  /* One report has its own endpoint, and it answers with 92 fields: the decoded
     twins, the context counts and the citation the sheet is built from. Asking
     the search endpoint for ctrl= sent an unknown filter name, which it refuses
     outright, so the sheet said the FAA had not answered and printed five rows
     where the reference prints nineteen. Falls back to the loaded page, so a
     row already on screen still opens if the endpoint is down. */
  fetch('/api/case/'+encodeURIComponent(id)).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(d){
    if(!d || d.error) throw new Error('empty');
    cb(d);
  }).catch(function(){
    cb(CASE_MAP && CASE_MAP[id] ? CASE_MAP[id] : null);
  });}
window.openCase=function(id){
  if(currentCase&&String(currentCase.OperatorControlNumber)===String(id)&&caseBox.classList.contains('open'))return;
  lastFocus=document.activeElement;
  var known=!!CASE_MAP[id];
  caseFromLink=!known;
  if(known)rrShow(CASE_MAP[id],id);
  else rrFetchOne(id,function(rep){
    if(rep){CASE_MAP[id]=rep;rrShow(rep,id);}
    else rrShow({OperatorControlNumber:id,Discrepancy:'The FAA did not answer for this control number.'},id);});};
window.rrCaseStep=function(dir){
  if(!currentCase)return;
  var idx=CASE_ORDER.indexOf(String(currentCase.OperatorControlNumber));
  var nxt=CASE_ORDER[idx+dir];
  if(nxt){lastFocus=document.activeElement;caseFromLink=false;rrShow(CASE_MAP[nxt],nxt);}};
function onPop(){
  var cid=null;try{cid=new URLSearchParams(location.search).get('case');}catch(e){}
  casePushed=false;
  if(cid){
    if(!caseBox.classList.contains('open')||(currentCase&&String(currentCase.OperatorControlNumber)!==String(cid)))
      openCase(cid);
  }else if(caseBox.classList.contains('open'))rrHide();}

/* ── copy bits ── */
window.copyBit=function(btn,kind){
  var d=currentCase;if(!d)return;
  var txt;
  if(kind==='quote')txt=quoteText(d);
  else if(kind==='cite')txt=mkCite(d)+' Desk permalink: '+location.href;
  else if(kind==='link')txt=location.href;
  else txt=quoteText(d)+'\n\n'+mkCite(d)+'\nDesk permalink: '+location.href;
  var orig=btn.dataset.orig||btn.textContent;btn.dataset.orig=orig;var t1,t2;
  function done(ok){clearTimeout(t1);clearTimeout(t2);
    btn.textContent=ok?'copied':'copy failed, select the text';
    if(ok)t1=setTimeout(function(){btn.textContent=orig;},1500);
    else t2=setTimeout(function(){btn.textContent=orig;},2600);}
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=false;
    try{ok=document.execCommand('copy');}catch(e){}
    ta.remove();done(ok);}
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){done(true);},fallback);
  else fallback();};

/* ── tooltip ── */
document.addEventListener('mouseover',function(e){
  var t=e.target&&e.target.closest?e.target.closest('.term'):null;if(!t)return;
  var html=null;
  if(t.dataset.tip){html='<b>'+esc(t.dataset.label||t.textContent)+'</b>'+(t.dataset.tip?'<br>'+esc(t.dataset.tip):'');}
  else if(t.dataset.t){var en=CODES[t.dataset.t]||JARGON[t.dataset.t];
    if(en){html='<b>'+esc(en.label)+'</b>';
      if(en.faa)html+='<br>'+esc(/^faa wording/i.test(en.faa)?en.faa:'FAA wording: '+en.faa);
      if(en.note)html+='<br>'+esc(en.note);}}
  if(html){tipEl.innerHTML=html;tipEl.style.display='block';tipEl.setAttribute('aria-hidden','false');
    var r=t.getBoundingClientRect(),x=Math.min(e.clientX||r.left,window.innerWidth-360),y=r.bottom+6;
    tipEl.style.left=Math.max(4,x)+'px';tipEl.style.top=Math.min(y,window.innerHeight-120)+'px';}});
document.addEventListener('mouseout',function(e){
  var t=e.target&&e.target.closest?e.target.closest('.term'):null;
  if(t&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.term')===t)){
    tipEl.style.display='none';tipEl.setAttribute('aria-hidden','true');}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){tipEl.style.display='none';tipEl.setAttribute('aria-hidden','true');}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&
     e.target.getAttribute('role')==='button'&&e.target.tagName!=='BUTTON'){
    e.preventDefault();e.target.click();}});

/* ── grid keyboard ── */
function bindGrid(){var tb=document.getElementById('rr-table');if(!tb||tb.dataset.kb)return;tb.dataset.kb='1';
  tb.addEventListener('keydown',function(e){
    if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Home','End'].indexOf(e.key)<0)return;
    var stops=RR_STOPS;if(!stops.length)return;
    var idx=stops.indexOf(document.activeElement),rowLen=RR_ROWLEN||1,n=stops.length,to=idx;
    if(e.key==='ArrowRight')to=(idx+1)%n;
    else if(e.key==='ArrowLeft')to=(idx-1+n)%n;
    else if(e.key==='ArrowDown')to=(idx+rowLen)%n;
    else if(e.key==='ArrowUp')to=(idx-rowLen+n)%n;
    else if(e.key==='Home')to=idx-(idx%rowLen);
    else if(e.key==='End')to=Math.min(idx-(idx%rowLen)+rowLen-1,n-1);
    if(to<0)to=0;
    stops.forEach(function(el){el.setAttribute('tabindex','-1');});
    stops[to].setAttribute('tabindex','0');stops[to].focus();
    e.preventDefault();});}

/* ── boot ── */
function loadGlossary(){
  return fetch('/api/glossary').then(function(r){return r.json();}).then(function(d){
    /* The endpoint answers with three parts: codes, holding one table per coded
       field; terms, holding the mechanics' abbreviations as key -> [Term,
       meaning]; and ata. Read as a flat list, terms had no .length, so the
       fallback walked the three top-level keys and built three nonsense
       entries. Every abbreviation in every write-up then went unexplained:
       396 underlined terms in the reference against 101 here, and all of those
       101 were something else. */
    var list=[];
    if(Array.isArray(d)) list=d;
    else if(d&&typeof d==='object'){
      var T=d.terms;
      if(T&&!Array.isArray(T)) Object.keys(T).forEach(function(k){
        var v=T[k];
        list.push(Array.isArray(v)
          ? {code:k,label:v[0]||k,faa:v[1]||''}
          : {code:k,label:(v&&(v.label||v.term))||k,faa:(v&&(v.faa||v.definition))||''});
      });
      var C=d.codes;
      if(C&&typeof C==='object') Object.keys(C).forEach(function(g){
        var tab=C[g]; if(!tab||typeof tab!=='object'||Array.isArray(tab))return;
        Object.keys(tab).forEach(function(k){
          var v=tab[k];
          list.push({code:k,group:g,
            label:(v&&(v.label||v.short))||String(v),
            faa:(v&&v.faa)||'', note:(v&&v.note)||''});
        });
      });
    }
    list.forEach(function(e){
      var code=e.code||e.term||e.key||e.id,grp=e.group||e.grp||e.type||'';
      if(!code)return;
      var en={label:e.label||e.plain||e.short||code,faa:e.faa||e.definition||e.faaWording||'',note:e.note||'',grp:grp,code:code};
      if(grp)CODES[grp+'|'+code]=en;
      if(!CODES[code])CODES[code]=en;
      if(/^[a-z][a-z&.\/#-]{1,6}$/.test(code)&&!/\s/.test(code))JARGON[code]=en;});
  });}
function loadFacets(){
  return fetch('/api/facets').then(function(r){return r.json();}).then(function(d){
    if(!d)return;
    OPGAP=d.opgap||d.opGap||d.operatorGap||OPGAP;
    var ops=d.operators||[];
    if(Array.isArray(ops))ops.forEach(function(o){
      if(Array.isArray(o))OPNAMES[o[0]]=o[1];
      else if(o&&o.code)OPNAMES[o.code]=o.name||o.label||o.code;});
    else if(ops&&typeof ops==='object')Object.keys(ops).forEach(function(k){OPNAMES[k]=ops[k];});
    if(d.months)RR_MONTHS=d.months;
    document.querySelectorAll('[data-opgap]').forEach(function(el){
      el.dataset.tip=OPGAP;el.setAttribute('title',OPGAP);});
  });}
function boot(){
  caseBox.setAttribute('role','dialog');caseBox.setAttribute('aria-modal','true');
  caseBox.setAttribute('aria-labelledby','case-title');caseBox.setAttribute('tabindex','-1');
  document.getElementById('rr-backup').addEventListener('click',function(){
    var t=document.getElementById('instrument')||document.querySelector('.hero,#hero,header,form');
    if(t&&t.scrollIntoView)t.scrollIntoView({behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});});
  caseBox.addEventListener('click',function(e){if(e.target===caseBox)closeCase();});
  window.addEventListener('popstate',onPop);
  window.addEventListener('resize',syncSwipeHint);
  document.addEventListener('click',function(){clearTimeout(RR_CT);RR_CT=setTimeout(checkRefresh,400);},true);
  setInterval(checkRefresh,900);
  new MutationObserver(function(){clearTimeout(RR_MO);
    RR_MO=setTimeout(function(){makeReachable();gridify();},60);
  }).observe(document.body,{childList:true,subtree:true});
  loadGlossary().catch(function(){}).then(loadFacets).catch(function(){}).then(function(){
    rrLoad(0,false);
    var cid=null;try{cid=new URLSearchParams(location.search).get('case');}catch(e){}
    if(cid)openCase(cid);});}
/* the controls half calls search(off); this block is inside its own IIFE,
   so the one entry point it needs is handed out deliberately. */
try{ window.__rrLoad = rrLoad; }catch(e){}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else setTimeout(boot,0);
})();



/* ---- bridge: the two halves of the desk ------------------------------
   The controls and the rows were specified as two halves of one surface and
   each was told to assume the other. Each then built a whole: its own search,
   its own count line, its own corpus total. This joins them.

   The controls call search(off) and expect a promise carrying {total, corpus}.
   The rows call it rrLoad(off), live inside their own closure, and announce
   the figure on an event instead of returning it. */

var SD_CORPUS = null;

/* Fetched once, on its own, because the page's own boot no longer runs: the
   instrument that replaced it never set TOTAL, so reading it gave 0 and
   "corpus minus selection" printed a negative number of reports set aside. */
var SD_CORPUS_P = fetch("api/facets")
  .then(function(r){ return r.ok ? r.json() : {}; })
  .then(function(f){
    var n = f && ((f.range && f.range.total) || f.total);
    if (n) { SD_CORPUS = n; try { sd2Total = n; } catch(e) {} }
    return SD_CORPUS;
  })
  .catch(function(){ return null; });

function search(off){
  if (!window.__rrLoad) return null;
  var p = new Promise(function(res){
    var done = false;
    function on(e){
      if (done) return;
      done = true; window.removeEventListener("sdr:rows", on);
      var d = e.detail || {};
      SD_CORPUS_P.then(function(c){
        if (d.corpus == null && c) d.corpus = c;
        res(d);
      });
    }
    window.addEventListener("sdr:rows", on);
    setTimeout(function(){
      if (!done) { done = true; window.removeEventListener("sdr:rows", on); res({}); }
    }, 20000);
  });
  window.__rrLoad(off || 0, false);
  return p;
}

/* The corpus figure decides what the on-purpose line says, so redraw it once
   the number is in rather than printing "reports." with nothing in front. */
SD_CORPUS_P.then(function(){
  try {
    if (typeof renderOnPurpose === "function" && typeof sd2HasFilter === "function"
        && !sd2HasFilter() && !REVEALED) renderOnPurpose();
  } catch(e) {}
});

/* The desk sits above the tab strip, outside it: #p-search exists and is empty,
   so the Search tab shows nothing and the controls stay on screen under every
   other panel. The reference puts them in the panel they belong to. Moved once,
   after both halves have mounted. */
(function(){
  function tuck(){
    var host=document.getElementById("p-search");
    if(!host) return false;
    var body=host.querySelector('[id$="-body"]')||host;
    var moved=false;
    ["sdControls","starters","rr-sec"].forEach(function(id){
      var n=document.getElementById(id);
      if(n && !host.contains(n)) { body.appendChild(n); moved=true; }
    });
    return moved;
  }
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",function(){ setTimeout(tuck,50); });
  else setTimeout(tuck,50);
  /* the panels mount lazily, so try again once they are up */
  var tries=0, iv=setInterval(function(){ if(tuck()||++tries>40) clearInterval(iv); }, 250);
})();

/* ---- the table lost 110px to nesting, and the gloss lost its button --------

   Moving the desk into #p-search put it inside two more padded boxes: the wrap
   gives 1040, the panel takes 18 either side and the section another 16, so a
   1080px table had 970 and scrolled sideways inside a panel inside a page. The
   box now bleeds back out to the panel's edge.

   And the write-ups lost the one thing this desk has that the reference does
   not: a model that reads the mechanic's own words back in plain English. The
   endpoint was still there; nothing called it. */
(function(){
  var css = document.createElement("style");
  css.textContent =
    "#p-search #rr-sec{padding-left:0;padding-right:0;margin-left:-18px;margin-right:-18px}" +
    "#p-search #rr-sec>*:not(.rr-scroll){padding-left:18px;padding-right:18px}" +
    "table.reps{min-width:1000px}" +
    /* the clipped band draws a fade over its own bottom edge, and the button
       sat under it: legible on a short write-up, ghosted on a long one,
       which is exactly where a reader wants it most. */
    ".wu-gloss{margin-top:6px;font:inherit;position:relative;z-index:3;background:transparent}" +
    ".wu.clip.long::after{z-index:1}" +
    ".wu-gloss button{background:none;border:1px solid #cfc6bd;border-radius:4px;" +
      "padding:2px 9px;font:12px/1.5 system-ui,sans-serif;color:#8a2a17;cursor:pointer}" +
    ".wu-gloss button:hover{background:#fdf1ec}" +
    ".wu-gloss button[disabled]{opacity:.55;cursor:default}" +
    ".wu-plain{margin-top:6px;padding:8px 11px;border-left:2px solid #c44b28;" +
      "background:#faf7f3;font:14.5px/1.5 Georgia,'Times New Roman',serif;color:#211d14;max-width:74ch}" +
    ".wu-plain .src{display:block;margin-top:5px;font:11.5px/1.4 system-ui,sans-serif;color:#756f69}";
  document.head.appendChild(css);

  function factsFor(wu){
    var tr = wu.closest("tr"); var rep = tr && tr.previousElementSibling;
    var out = {};
    if (rep && rep.cells) {
      var c = rep.cells;
      var g = function(i){ return c[i] ? c[i].innerText.replace(/\s+/g," ").trim() : ""; };
      out.date = g(0).split("\n")[0]; out.operator = g(1); out.model = g(2);
      out.system = g(4); out.part = g(5); out.nature = g(6);
      out.crew = g(7); out.discovered = g(8); out.stage = g(9);
    }
    Object.keys(out).forEach(function(k){ if(!out[k]) delete out[k]; });
    return out;
  }

  function addButtons(){
    var list = document.querySelectorAll(".wu");
    for (var i = 0; i < list.length; i++) {
      var wu = list[i];
      if (wu.querySelector(".wu-gloss")) continue;
      var bar = document.createElement("div");
      bar.className = "wu-gloss";
      var btn = document.createElement("button");
      btn.type = "button"; btn.textContent = "Say it in plain English";
      /* the band toggles its own clamp on click, so this must not bubble into
         it. Bound on the button itself: a stopPropagation on the bar killed the
         delegated handler along with the toggle, and the button did nothing at
         all, in silence. */
      btn.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); askGloss(btn); });
      bar.appendChild(btn);
      wu.appendChild(bar);
    }
  }

  function askGloss(b){
    var wu = b.closest(".wu"); if (!wu) return;
    var txt = wu.querySelector(".txt");
    var raw = txt ? txt.innerText.replace(/\s+/g, " ").trim() : "";
    if (!raw) return;
    b.disabled = true; b.textContent = "Reading it…";
    var body = factsFor(wu); body.text = raw;
    fetch("api/gloss", {method:"POST", headers:{"Content-Type":"application/json"},
                        body: JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var out = document.createElement("div");
        out.className = "wu-plain";
        if (d && d.plain) {
          out.textContent = d.plain;
          var s = document.createElement("span"); s.className = "src";
          /* the model read the mechanic's words and the decoded codes, nothing
             else. Said on the page, not in a footnote. */
          s.textContent = "Written by GLM-5.3-Flash from the write-up above and "
            + "the codes the filer entered. It adds nothing the report does not say.";
          out.appendChild(s);
        } else if (d && d.abstained) {
          out.textContent = "The model declined to put this in plain English"
            + (d.reason ? ": " + d.reason : ".");
        } else {
          out.textContent = "No plain-English reading came back"
            + (d && d.error ? " (" + d.error + ")." : ".");
        }
        b.parentNode.appendChild(out);
        b.remove();
      })
      .catch(function(err){
        b.disabled = false; b.textContent = "Say it in plain English";
        var out = document.createElement("div");
        out.className = "wu-plain";
        out.textContent = "That did not reach the model (" + (err && err.message || err) + ").";
        b.parentNode.appendChild(out);
      });
  }

  /* an interval that touches the DOM twice a second shows up as a jitter while
     reading. Observe the table instead and add buttons only when rows change. */
  var mo=new MutationObserver(function(){ addButtons(); });
  function watch(){
    var t=document.getElementById("rr-scroll")||document.body;
    mo.observe(t,{childList:true,subtree:true});
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",watch);
  else watch();
  addButtons();
  setTimeout(addButtons,1500); setTimeout(addButtons,4000);
})();

window.drawInstrument=drawInstrument;
})();
