<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The instrument, rebuilt by GLM-5.3-Flash</title>
<meta name="description" content="FAA Service Difficulty Reports. The instrument
from aircraftdefects.com, rebuilt line by line by GLM-5.3-Flash.">
<style>html,body{margin:0;padding:0;background:#f2eee6}</style>
<style>
/* ---------------------------------------------------------------------------
   the instrument's clothes. paper, ash, ink; rust is reserved for a chosen
   selection and appears nowhere else. everything is scoped under #hero-root
   so the instrument can sit inside a page without borrowing its habits. */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&display=swap');

#hero-root{
  --paper:#f2eee6; --card:#f9f6ee; --ink:#211d14; --ash:#8c8474;
  --line:#dcd3bf; --faint:#e8e1d0; --rest:#e3dbc6; --held:#c9bda0;
  --rust:#a8431f; --rust-text:#8f3517;
  font-family:Archivo,system-ui,sans-serif; color:var(--ink);
  background:var(--paper);
}
#hero-root *,#hero-root *::before,#hero-root *::after{box-sizing:border-box}
#hero-root button{font-family:inherit;color:inherit}
#hero-root :focus{outline:none}
#hero-root :focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.instrument{max-width:1080px;margin:0 auto;padding:26px 18px 34px}
.ipad{background:var(--card);border:1px solid var(--line);padding:20px 22px 16px;transition:opacity .15s}
.ipad.busy{opacity:.55;pointer-events:none}

.ihead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:11px}
.stamp{font:500 10.5px/1.5 "IBM Plex Mono",monospace;letter-spacing:.13em;color:var(--ash);
  text-transform:uppercase}
.picker{display:flex;flex-wrap:wrap;gap:2px}
.picker button{appearance:none;background:none;border:1px solid transparent;padding:6px 10px 5px;
  cursor:pointer;text-align:left}
.picker button .q{display:block;font:700 10.5px/1.3 Archivo,sans-serif;letter-spacing:.1em;color:var(--ash)}
.picker button .pn{display:block;font:400 9.5px/1.5 "IBM Plex Mono",monospace;color:var(--ash)}
.picker button:hover .q{color:var(--ink)}
.picker button.on{border-color:var(--line);background:var(--paper)}
.picker button.on .q{color:var(--rust-text)}

.sentence{font:400 30px/1.28 "Instrument Serif",serif;margin:18px 0 2px;max-width:54ch}
.sentence .cn{color:var(--rust-text)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:baseline;gap:6px;font:400 11px/1.4 "IBM Plex Mono",monospace;
  border:1px solid var(--line);background:var(--paper);padding:3px 8px;color:#5f584f}
.chip .cl{color:var(--ash);letter-spacing:.05em}
.chip b{cursor:pointer;font-weight:400;padding:0 1px;color:var(--ash)}
.chip b:hover{color:var(--rust-text)}

.aim{min-height:21px;margin-top:9px;font:400 12.5px/1.5 "IBM Plex Mono",monospace;color:#5f584f}
.aim:empty{margin-top:0}
.undoit{appearance:none;background:none;border:0;border-bottom:1px solid var(--rust-text);
  color:var(--rust-text);font:400 12px "IBM Plex Mono",monospace;cursor:pointer;padding:0 0 1px;margin-left:8px}
.undoit:hover{color:var(--ink);border-color:var(--ink)}

.aimat{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;position:relative}
.aimat>label{font:600 10px/1 Archivo,sans-serif;letter-spacing:.09em;color:var(--ash)}
#aimKind,#aimAt{font:400 12px/1.3 "IBM Plex Mono",monospace;background:var(--paper);
  border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:2px}
#aimAt{min-width:300px;flex:1}
#aimDay{font:400 11px "IBM Plex Mono",monospace;border:1px solid var(--line);background:var(--paper);
  color:#5f584f;padding:5px 6px;border-radius:2px}
.aimday{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 Archivo,sans-serif;
  letter-spacing:.09em;color:var(--ash)}
.aimsug{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:var(--card);
  border:1px solid var(--line);box-shadow:0 6px 18px rgba(33,26,12,.14);max-height:340px;overflow:auto}
.sughead{font:700 9px/1 Archivo,sans-serif;letter-spacing:.12em;color:var(--ash);
  padding:9px 10px 3px;border-top:1px solid var(--faint)}
.sughead:first-child{border-top:0}
.sug{display:flex;gap:10px;align-items:baseline;padding:5px 10px;cursor:pointer}
.sug:hover,.sug.on{background:var(--paper)}
.sug .sl{font-size:12px}
.sug .sw{flex:1;text-align:right;font:400 10.5px "IBM Plex Mono",monospace;color:var(--ash)}
.sug b{font:500 11px "IBM Plex Mono",monospace;color:var(--rust-text);min-width:56px;text-align:right}

.hand{margin-top:9px;font-size:11px;color:var(--ash)}
.kbd,.kb-fine,.kb-coarse{display:block;font:400 10.5px/1.6 "IBM Plex Mono",monospace;color:#a89f8c}
.kb-coarse{display:none}
@media(pointer:coarse){.kb-fine{display:none}.kb-coarse{display:inline}}

.zero{margin-top:12px;border:1px dashed var(--line);background:var(--paper);padding:10px 12px}
.zero b{font:600 12.5px Archivo,sans-serif}
.zg{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.ghost{appearance:none;background:none;border:1px solid var(--line);color:#5f584f;
  font:500 11px/1.2 Archivo,sans-serif;padding:5px 10px;border-radius:2px;cursor:pointer}
.ghost:hover{border-color:var(--rust);color:var(--rust-text)}

.rails{margin-top:14px;display:flex;flex-direction:column}
.rail{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:start;
  padding:7px 0;border-top:1px solid var(--faint)}
.rail:first-child{border-top:0}
.rail.closed{cursor:pointer;align-items:center;padding:9px 0}
.rail.closed:hover .strip{background:var(--held)}
.restbtn{appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:left;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;width:100%}
.restbtn .q{font:700 11px/1 Archivo,sans-serif;letter-spacing:.08em}
.restbtn .pn{font:400 9.5px "IBM Plex Mono",monospace;color:var(--ash)}
.restbtn .val{font:400 10.5px "IBM Plex Mono",monospace;color:var(--rust-text)}
.rail.closed .strip{height:13px;background:var(--rest);display:flex;overflow:hidden;transition:background .12s}
.rail.open{padding:9px 0 12px}
.gut .q{font:700 11px/1.3 Archivo,sans-serif;letter-spacing:.08em}
.gut .pn{font:400 9.5px/1.6 "IBM Plex Mono",monospace;color:var(--ash)}
.gut .val{font:400 10.5px/1.5 "IBM Plex Mono",monospace;color:var(--rust-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px}
.track{min-width:0;position:relative}
.track.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,1fr);gap:22px}
.track.two.wside{grid-template-columns:minmax(0,1fr) 330px}

/* when: the strip of months */
#whenTrack{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.scrollw{width:max-content;min-width:100%}
.months{display:flex;align-items:flex-end;gap:1px;height:66px;user-select:none;-webkit-user-select:none}
@media(pointer:fine){.months{touch-action:none}}
.mo{position:relative;flex:0 0 4px;width:4px;height:100%;background:none;border:0;padding:0;cursor:pointer}
.mo i{position:absolute;bottom:0;left:0;right:0;background:var(--rest)}
.mo u{position:absolute;bottom:0;left:0;right:0;background:var(--rust);opacity:.85;text-decoration:none}
.mo:hover i,.mo:focus-visible i{background:var(--held)}
.mo:focus-visible{outline:none}
.mo:focus-visible i{background:var(--ink)}
.mo.inband i{background:#cbbd9c}
.mo.part::after{content:"";position:absolute;top:0;left:-1px;right:-1px;border-top:1px dashed var(--ash)}
.axis{position:relative;height:16px;margin-top:4px}
.axis span{position:absolute;top:0;transform:translateX(-50%);
  font:400 9.5px "IBM Plex Mono",monospace;color:var(--ash)}
.axis span::before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:3px;background:var(--ash)}

/* where: the aircraft */
.ac{width:100%;height:auto;display:block}
.zone{stroke:rgba(33,28,17,.30);stroke-width:1;cursor:pointer;transition:stroke .1s}
.zone:hover,.zone:focus-visible{stroke:var(--rust);stroke-width:2.2;outline:none}
.zone.taken{stroke:var(--rust);stroke-width:2.6}
.zone.hit{pointer-events:all}
.hull{fill:none;stroke:var(--ink);stroke-width:1.5;pointer-events:none}
.zonenote{font-size:12px;line-height:1.55;color:#5f584f;margin-top:8px;max-width:62ch}
.zl{display:flex;flex-direction:column;gap:1px}
.zlrow{appearance:none;background:none;border:0;display:grid;
  grid-template-columns:14px 62px minmax(0,1fr) 62px;gap:8px;align-items:center;
  padding:4px 6px;cursor:pointer;text-align:left}
.zlrow:hover{background:var(--paper)}
.zlrow .swz{width:13px;height:13px;border:1px solid rgba(33,28,17,.35)}
.zlrow .zlq{font:700 10px/1.2 Archivo,sans-serif;letter-spacing:.07em}
.zlrow .zld{font-size:11.5px;color:#5f584f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zlrow b{font:500 11px "IBM Plex Mono",monospace;text-align:right}
.zlrow.taken .zlq,.zlrow.taken b{color:var(--rust-text)}
.zlrow.taken .swz{border-color:var(--rust);border-width:2px}

/* whose and forced: ladders */
.lhead{font:700 9.5px/1 Archivo,sans-serif;letter-spacing:.11em;color:var(--ash);margin-bottom:6px}
.ladder{display:flex;flex-direction:column;gap:1px}
.lrow{appearance:none;background:none;border:0;display:grid;
  grid-template-columns:minmax(96px,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;
  padding:3px 6px;cursor:pointer;text-align:left}
.lrow:hover{background:var(--paper)}
.lrow .lb{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .bar{height:9px;background:var(--rest);position:relative}
.lrow .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--held)}
.lrow b{font:400 11px "IBM Plex Mono",monospace;text-align:right;color:#5f584f}
.lrow.taken .lb{color:var(--rust-text)}
.lrow.taken .bar i{background:var(--rust)}
.lmore{font:400 10.5px/1.6 "IBM Plex Mono",monospace;color:#a89f8c;margin-top:7px}
.fblock{margin-bottom:10px;cursor:default}
.fblock .big{height:20px;background:var(--rest);position:relative}
.fblock .big i{position:absolute;top:0;bottom:0;left:0;background:var(--rust);opacity:.85}
.fblock .fcap{font:400 11px/1.6 "IBM Plex Mono",monospace;color:#5f584f;margin-top:5px}

/* specimen, margin, seam */
.specimen{margin-top:14px;border-top:1px solid var(--faint);padding-top:10px}
.specimen .sh{font:600 10px/1.4 Archivo,sans-serif;letter-spacing:.09em;color:var(--ash)}
.sf{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:7px}
.sf span{font:400 10.5px/1.5 "IBM Plex Mono",monospace;color:#5f584f}
.sf span i{font-style:normal;color:var(--ash);letter-spacing:.05em;margin-right:5px}
.sl{font:400 19px/1.5 "Instrument Serif",serif;margin-top:9px;max-width:74ch}
.sl::before{content:"\201C";color:var(--ash)}
.sl::after{content:"\201D";color:var(--ash)}
.margin{margin-top:14px;border-top:1px solid var(--faint);padding-top:9px;
  display:flex;flex-direction:column;gap:4px}
.margin:empty{display:none;border:0;padding:0}
.mn{font:400 11px/1.6 "IBM Plex Mono",monospace;color:#6d6553}
.mn.warn{color:var(--rust-text)}
.seam{display:block;width:100%;appearance:none;background:none;border:0;
  border-top:1px solid var(--line);margin-top:2px;padding:13px 2px 2px;text-align:left;
  font:500 13px/1.4 "IBM Plex Mono",monospace;letter-spacing:.03em;color:var(--rust-text);cursor:pointer}
.seam:hover{color:var(--ink)}

/* the inspect-then-commit pill for touch */
.phpill{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:80;appearance:none;
  border:0;background:var(--ink);color:var(--paper);font:500 12px/1 "IBM Plex Mono",monospace;
  padding:11px 15px;border-radius:3px;cursor:pointer;box-shadow:0 6px 20px rgba(20,15,6,.3)}
.phpill .go{color:#f0b294;margin-left:6px}

@media(max-width:760px){
  .instrument{padding:14px 10px 24px}
  .ipad{padding:14px 12px 12px}
  .sentence{font-size:23px}
  .ihead{flex-direction:column;align-items:stretch}
  .rail{grid-template-columns:1fr;gap:7px}
  .gut .val{max-width:none}
  .track.two,.track.two.wside{grid-template-columns:1fr;gap:16px}
  #aimAt{min-width:0;flex:1 1 100%}
  .lrow{grid-template-columns:minmax(72px,40vw) minmax(0,1fr) 56px;gap:6px}
  .zlrow{grid-template-columns:14px 54px minmax(0,1fr) 54px;gap:6px}
}

/* ===================== WHERE rail (anatomy) ===================== */
.plane{width:100%;max-width:640px;height:auto}
.zone{cursor:pointer;transition:stroke .1s}
.zone:hover,.zone:focus-visible{stroke:var(--rust);stroke-width:2.2}
.zone.lit{stroke:var(--rust);stroke-width:2.4}
.zone.taken{stroke:var(--rust);stroke-width:2.6}
/* a stroke-only ring vanishes on the busiest zones, which are the ones
   people reach for first — hence the drop-shadow behind the keyboard ring */
.zone:focus-visible{outline:none;filter:drop-shadow(0 0 0 2px var(--ink))}
.zone:focus-visible{stroke:var(--ink);stroke-width:3}
@media (forced-colors: active){.zone{stroke:CanvasText}[data-take].taken{outline:3px solid Highlight}}

/* closed rail strip */
.strip{display:flex;gap:1px;height:12px}
.strip span{background:#d8d2c6;border-radius:1px}
.strip span.sel{background:var(--rust)}
.rail:not(.open):hover .strip span{background:#c3bbac}

/* open layout */
.rail .track.two{display:grid;grid-template-columns:1fr 330px;gap:18px}
.rail>.reading{grid-column:2}

/* legend */
.lrow{display:grid;grid-template-columns:13px 1fr auto;gap:8px;align-items:center;cursor:pointer;padding:1px 4px;border-radius:3px}
.lrow:hover,.lrow:focus-visible{background:rgba(196,75,40,.08)}
.lrow i{width:12px;height:12px;border-radius:3px;border:1px solid #d8d2c6}
.lrow i.padi{background:repeating-linear-gradient(45deg,#d8d2c6 0 2px,var(--paper) 2px 4px)}
.lsplit{border-top:1px dotted var(--ash);margin:4px 0 3px}
.lrow.taken{background:rgba(196,75,40,.14);box-shadow:inset 2px 0 0 var(--rust)}
.lrow.lit{background:rgba(196,75,40,.10)}

/* note under the legend */
.zonenote{font-size:11.5px;color:#5f584f;line-height:1.45;margin-top:7px;padding-top:6px;border-top:1px solid var(--line)}

/* phone: the aircraft becomes a 3x3 grid */
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.phcell{background:rgba(196,75,40,var(--f,.1));border:1px solid #7c746a;border-radius:6px;
  padding:9px 8px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.phcell b{font-size:12px;color:var(--smoke)}
.phcell.pad{background:repeating-linear-gradient(45deg,#efeae0 0 4px,var(--paper) 4px 8px)}
.phcell.taken,.phcell.lit{box-shadow:inset 0 0 0 2px var(--rust)}

/* the reference drops to one column near 960, not 760. Held to 760 the
   drawing was squeezed into whatever the legend left over: 312px against
   the reference's 640 at a 900px window, a third of the picture. */
@media (max-width:960px){.rail .track.two{grid-template-columns:1fr}.rail>.reading{grid-column:1}}

.ihead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.picker{display:flex;gap:2px}
.picker button{background:none;border:0;border-bottom:2px solid transparent;padding:3px 10px 5px;
  cursor:pointer;text-align:left;font:inherit;color:var(--ash)}
.picker button .q{display:block;font:600 11px/1.2 Archivo,system-ui,sans-serif;letter-spacing:.08em}
.picker button .pn{display:block;font-size:9.5px;color:#5f584f;margin-top:1px}
.picker button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--rust);
  background:#f6f2ea;border-radius:4px 4px 0 0}
.picker button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media(max-width:760px){.picker{width:100%}.picker button{flex:1;padding:3px 4px 5px}}

.l3wrap{overflow-x:auto;max-width:100%;margin-top:6px;border:1px solid #d8d2c6;border-radius:6px}
table.l3{border-collapse:collapse;width:100%;font-size:12.5px}
table.l3{width:100%;table-layout:auto}
table.l3 td{padding:4px 8px;border-top:1px solid #ece6da;white-space:nowrap;vertical-align:top}
/* the last column carries a sentence, not a value: nowrap pushed it off
   the page and left a scrollbar under a readable table */
table.l3 td:last-child{white-space:normal;line-height:1.45}
table.l3 tr:first-child td{border-top:0}


#sdControls{margin:16px 0 0;font:15px/1.45 Georgia,serif;color:#2b2622}
#sdControls label{display:block;font:600 11px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6f6a63;margin-bottom:3px}
#sdControls input,#sdControls select{font:14px/1.3 system-ui,sans-serif;padding:7px 9px;border:1px solid #cfc6bd;background:#fff;border-radius:3px;max-width:100%}
#sdControls input.landed,#sdControls select.landed{border-left:4px solid #8a2a17;background:#fdf7f4}
#sdControls .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
#sdControls .fld{min-width:0}
#sdControls .fld.grow{flex:1 1 260px}
#sdControls .fld.btns{flex-direction:row;gap:8px}
.sdbtn{display:inline-block;font:600 13px system-ui,sans-serif;padding:8px 14px;border:1px solid #8a2a17;background:#8a2a17;color:#fdf7f4;border-radius:3px;cursor:pointer;text-decoration:none}
.sdbtn.off{opacity:.45;cursor:not-allowed}
.ghostbtn{font:500 13px system-ui,sans-serif;padding:8px 12px;border:1px solid #cfc6bd;background:#fff;color:#4a443e;border-radius:3px;cursor:pointer}
#moreFilters{margin-top:12px;font:14px system-ui,sans-serif}
#moreFilters summary{cursor:pointer;color:#5d4a72;font-weight:600}
#moreFilters .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
#starters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
#starters button{font:13px system-ui,sans-serif;padding:6px 11px;border:1px solid #d8cfc5;background:#fbf8f5;color:#4a443e;border-radius:16px;cursor:pointer}
#starters button:hover{border-color:#8a2a17;color:#8a2a17}
#starters button.extra{display:none}
#starters.all button.extra{display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font:13px system-ui,sans-serif;background:#fdf1ec;border:1px solid #f0d5cb;color:#8a2a17;padding:4px 8px;border-radius:3px}
.chip.warn{background:#fdf3ee;border-color:#eec9b8;color:#7c3a1f}
.chip em{font-style:italic;opacity:.85}
.chip b{cursor:pointer;margin-left:6px;font-weight:700}
.unresolved{margin-top:10px;background:#fdf3ee;border:1px solid #eec9b8;color:#7c3a1f;padding:10px 12px;border-radius:3px}
.sdcount{margin-top:12px;font-size:16px}
.sdcount .fig{font-size:1.4em;font-weight:700}
.sdcount .aside{color:#6f6a63;font-style:italic}
.sdcount .broken{display:block;margin-top:4px;color:#8a2a17;font-weight:bold;font-size:14px}
.clause{cursor:pointer;text-decoration:underline dotted #8a2a17;text-underline-offset:3px}
.clause:hover,.clause:focus{background:#fdf1ec;outline:none}
.sdsentence{margin-top:4px;color:#5d4a72}
.actions{margin-top:12px;display:flex;gap:10px;align-items:center}
.copied{font:italic 13px Georgia,serif;color:#3f6b57}
.norows{margin-top:14px;border:1px dashed #cfc6bd;background:#fbf8f5;padding:18px;border-radius:3px}
.norows .muted{color:#6f6a63}
#iAim.aim{min-height:1.5em;margin-bottom:6px;font-style:italic;color:#5d4a72}
#iAim.held{color:#8a2a17}
#iAim:empty{display:none}
.aimchoice,.undobtn{font:13px system-ui,sans-serif;padding:4px 10px;margin-left:6px;border:1px solid #8a2a17;background:#fdf7f4;color:#8a2a17;border-radius:3px;cursor:pointer}
.aimbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;margin:8px 0}
.aimbox label{margin:0}
.aimbox .aimday{font:italic 13px Georgia,serif;text-transform:none;letter-spacing:0;color:#6f6a63}
.aimsug{position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border:1px solid #cfc6bd;border-radius:3px;max-height:320px;overflow:auto;box-shadow:0 4px 10px rgba(43,38,34,.12)}

<script>
(function(){
"use strict";

/* ===========================================================================
   one instrument at the top of the page: four rails, one open at a time,
   every mark on every rail a filter the whole page obeys. Nothing on it is
   decoration; if a box is empty that is said in words, never implied. */

const el=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>Number(n||0).toLocaleString("en-US");
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const pad2=n=>String(n).padStart(2,"0");
const MONTHS=["","January","February","March","April","May","June","July","August","September","October","November","December"];
function monthName(m){const p=String(m).split("-");return `${MONTHS[+p[1]]||m} ${p[0]}`}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function prettyDate(iso){if(!iso||iso.length<7)return String(iso||"");
  const y=iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10)||1;
  return `${d} ${MONTHS[m]?MONTHS[m].slice(0,3):iso} ${y}`}
const MON3=i=>MONTHS[i]?MONTHS[i].slice(0,3):"";

const FILTER_KEYS=["q","operator","make","model","tail","part","condition","stage","discovered",
  "nature","crew","jasc","ata","zone","corrosion","cracked","minhours","from","to"];
const DRAWN=new Set(["from","to","zone","operator","tail","crew"]);
const LABEL={q:"words",operator:"airline",make:"make",model:"model",tail:"airframe",part:"part",
  condition:"condition",stage:"stage",discovered:"discovered",nature:"nature",crew:"crew action",
  jasc:"system code",ata:"ATA chapter",zone:"zone",corrosion:"corrosion",cracked:"cracking",
  minhours:"hours",from:"from",to:"to"};
const RAILS=[["when","WHEN","month by month"],["where","WHERE","on the aircraft"],
             ["whose","WHO","airline and tail"],["forced","FORCED","what the crew did"]];
const HAND={when:"Drag across the months to take a period.",
  where:"Click a zone on the aircraft to keep only what was found there.",
  whose:"Click an airline or an airframe to follow it.",
  forced:"Click what the crew had to do."};
const AIMKINDS=[["period","a month or year"],["operator","an airline"],["tail","a tail number"],
  ["zone","a zone"],["jasc","a system code"],["","free text"]];
const AIMPH={"":"any words the mechanic wrote, e.g. bird strike",
  period:"a month or a year, e.g. August or 2025",operator:"an airline, e.g. United or UAL",
  tail:"a tail number, e.g. N583",zone:"a zone, e.g. ZONE 300",jasc:"a system code, e.g. 3230"};
const KINDLAB={period:"MONTH OR YEAR",zone:"ZONE",operator:"AIRLINE",tail:"TAIL",
  crew:"CREW ACTION",jasc:"SYSTEM",q:"WORD IN THE WRITE-UPS"};

/* the FAA zones the drawing must place, and what each covers, for the moments
   the glossary is silent. every one is drawn; none is left to imply zero. */
const ZONE_ORDER=["100","200","300","400","500","600","700","800","900"];
const ZONE_DESC={100:"nose and forward lower fuselage",200:"forward upper fuselage",
  300:"aft lower fuselage",400:"fin and stabilizers",500:"left wing, the near one",
  600:"right wing, the far one",700:"aft upper fuselage, cabin",800:"engines and pylons",
  900:"landing gear"};

/* --- state ------------------------------------------------------------- */
let ROOT=null,RAIL="when",HERO=null,FACETS=null,TREND_ALL=[],RANGE={from:"",to:""};
let TOTAL=0,CORPUS=0,LOADING=false,PENDING_HOLD=null,SEQ=0;
let ANCHOR=null,DRAG=null,MO_ROVE=null,SUGSRC=[],SUG=[],SUGI=-1,sugTimer=null,sugSeq=0;
let PILL=null;
const COARSE=window.matchMedia("(pointer:coarse)");
const params=()=>new URLSearchParams(location.search);
const active=()=>FILTER_KEYS.filter(k=>params().has(k));
const hasTable=()=>!!document.querySelector("table.reports");

/* --- the aircraft ------------------------------------------------------
   a side view whose zones tile the whole silhouette: nothing of the shape is
   left unshaded, and what cannot be drawn is said in words underneath. */
const AC={
  hull:"M46 122 C56 101 80 89 112 88 L508 88 C596 90 668 96 722 104 C690 128 640 146 556 154 C470 158 220 159 116 158 C82 157 56 142 46 122 Z",
  fin:"M594 98 C614 66 646 32 682 16 L712 16 C716 48 720 78 723 106 Z",
  fw:"M324 90 Q400 62 500 36 L520 40 Q470 64 440 90 Z",
  nw:"M298 150 Q392 178 476 204 L496 211 Q460 192 430 158 L298 150 Z",
  stab:"M642 116 L736 126 L752 134 L668 138 Z",
  pylon:"M318 184 L336 184 L344 150 L324 150 Z",
  nac:"M296 196 C296 187 303 182 314 182 L372 182 C384 182 390 189 390 201 C390 213 384 220 372 220 L314 220 C303 220 296 215 296 206 Z"

function hexMix(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const ch=(sh)=>Math.round(((pa>>sh&255)+((pb>>sh&255)-(pa>>sh&255))*t));
  return "#"+[16,8,0].map(sh=>pad2(ch(sh).toString(16).length<2?"0"+ch(sh).toString(16):ch(sh).toString(16))).join("");
}
const RAMP_LO="#e6ddc7",RAMP_HI="#a8431f";
const ramp=f=>hexMix(RAMP_LO,RAMP_HI,Math.min(1,Math.max(0,f)));

/* --- fetching ---------------------------------------------------------- */
async function api(p){
  const u=new URL(p,location.href);
  const qs=params();
  FILTER_KEYS.forEach(k=>{if(qs.has(k))u.searchParams.set(k,qs.get(k))});
  const r=await fetch(u,{headers:{accept:"application/json"}});
  if(!r.ok)throw new Error("http "+r.status);
  return r.json();
}
async function plain(p){
  const r=await fetch(new URL(p,location.href),{headers:{accept:"application/json"}});
  if(!r.ok)throw new Error("http "+r.status);
  return r.json();
}
function asRows(d,key){
  if(d==null)return [];
  if(Array.isArray(d))return d;
  const a=d[key]||d.rows||d.data||d.months||d.trend;
  return Array.isArray(a)?a:[];
}

/* --- glossary ----------------------------------------------------------
   the api hands over FAA code tables in whatever shape it keeps them; eat
   them all, then look codes up by trying every plausible table name. */
let GLOSS={};
function glossInit(g){
  GLOSS={};if(!g)return;
  const eat=(name,obj)=>{
    if(!obj)return;const m=new Map();
    if(Array.isArray(obj))obj.forEach(x=>{const c=String(x.code??x.value??x.key??"");
      const l=x.label??x.name??x.title??x.text;if(c)m.set(c,String(l??c))});
    else Object.entries(obj).forEach(([c,l])=>m.set(String(c),
      typeof l==="string"?l:(l&&(l.label||l.name))||c));
    if(m.size)GLOSS[String(name).toLowerCase()]=m;
  };
  if(Array.isArray(g))g.forEach(t=>eat(t.table||t.name||t.id,t.entries||t.rows||t.values||t.codes));
  else Object.entries(g).forEach(([k,v])=>{
    if(v&&(v.entries||v.rows||v.values||v.codes))eat(k,v.entries||v.rows||v.values||v.codes);
    else if(v&&typeof v==="object")eat(k,v);
  });
}
function gLook(names,code){
  code=String(code==null?"":code);
  for(const nm of names){const m=GLOSS[nm];if(m&&m.has(code))return m.get(code)}
  return null;
}
const zoneGloss=c=>gLook(["part_location","zone","zones","location"],c);
/* The codes are prefixed at source: 'ZONE 200', never '200'. This used to
   add its own prefix, so a taken zone read "ZONE ZONE 200". zLabel prefers the
   label the API sends, which is the FAA's own wording. */
const zoneLabel=c=>{const bare=String(c).replace(/^ZONE\s+/i,"");
  return (typeof zLabel==="function"?zLabel("ZONE "+bare):null)
      || zoneGloss("ZONE "+bare) || zoneGloss(bare) || ("ZONE "+bare)};
const zoneDesc=c=>ZONE_DESC[String(c)]||"";
const crewGloss=c=>gLook(["precautionary_procedure","precautionary","precaution","crew"],c);
const jascGloss=c=>gLook(["jasc","jasc_code","system","jasc_code_description"],c);

/* --- normalisation -----------------------------------------------------
   every field the rails need has a primary source in api/hero and a fallback
   built from facets and trend, so a thin hero answer still draws honestly. */
function facetVals(key){
  const f=FACETS;if(!f)return [];
  const src=(f.facets||f.filters||f);
  let a=src&&src[key];
  if(a&&a.values)a=a.values;if(a&&a.buckets)a=a.buckets;
  if(Array.isArray(a))return a.map(x=>typeof x==="object"
    ?{value:String(x.value??x.key??x.code??x.term??x.name??""),n:+(x.n??x.count??x.doc_count??0),label:x.label??x.name}
    :{value:String(x),n:0}).filter(x=>x.value!=="");
  if(a&&typeof a==="object")return Object.entries(a).map(([value,v])=>({value,
    n:+(typeof v==="number"?v:(v&&(v.n??v.count))||0),label:typeof v==="object"&&v?v.label:undefined}));
  return [];
}
function buildMonths(){
  if(HERO.raw&&Array.isArray(HERO.raw.months)&&HERO.raw.months.length)
    return HERO.raw.months.map(m=>({m:String(m.m||m.month),n:+(m.n??m.count??0),all:+(m.all??m.n??m.count??0)}));
  const sel=new Map(asRows(HERO.trendSel,"trend").map(r=>[String(r.month||r.m||r.date),+(r.n??r.count??0)]));
  const all=new Map(TREND_ALL.map(r=>[String(r.month||r.m||r.date),+(r.n??r.count??0)]));
  let keys=[...all.keys()];if(!keys.length)keys=[...sel.keys()];
  const dated=params().has("from")||params().has("to");
  return keys.sort().map(k=>({m:k,all:all.get(k)||0,
    n:sel.has(k)?sel.get(k):(dated?0:(all.get(k)||0))}));
}
function buildZones(){
  const src=(HERO.raw&&HERO.raw.zones)?HERO.raw.zones.map(z=>({
    code:String(z.code??z.zone??z.value),n:+(z.n??z.count??0),label:z.label})):facetVals("zone");
  const by=new Map(src.map(z=>[z.code,z]));
  return ZONE_ORDER.map(c=>({code:c,label:zoneLabel(c),n:by.has(c)?by.get(c).n:0}));
}
function buildOps(){
  let rows=(HERO.raw&&HERO.raw.operator_rows)?HERO.raw.operator_rows.map(r=>({
    key:String(r.o??r.operator??r.key??r.value),n:+(r.n??r.count??0),label:r.label})):facetVals("operator");
  rows=rows.map(r=>({key:r.key,n:r.n,label:r.label||gLook(["operator","airline","carrier"],r.key)||r.key}))
           .sort((a,b)=>b.n-a.n);
  return rows;
}
function buildSwarm(){
  let rows=(HERO.raw&&HERO.raw.swarm)?HERO.raw.swarm.map(r=>({
    key:String(r.t??r.tail??r.key??r.value),n:+(r.n??r.count??0)})):facetVals("tail");
  return rows.map(r=>({key:r.key,n:r.n})).sort((a,b)=>b.n-a.n);
}
function buildCrew(){
  let rows=(HERO.raw&&HERO.raw.crew)?HERO.raw.crew.map(r=>({
    code:String(r.code??r.key??r.value),n:+(r.n??r.count??0),label:r.label})):facetVals("crew");
  return rows.map(r=>({code:r.code,n:r.n,label:r.label||crewGloss(r.code)||("code "+r.code)}))
             .sort((a,b)=>b.n-a.n);
}
function composeHero(raw){
  raw=raw||{};

  HERO.refused=!!(raw.refused||(raw.unresolved&&(Array.isArray(raw.unresolved)?raw.unresolved.length:Object.keys(raw.unresolved).length)));
  const fr=(raw.range)||(FACETS&&(FACETS.range||FACETS.coverage))||{};
  RANGE={from:fr.from||fr.min||"",to:fr.to||fr.max||""};
  const ftotal=FACETS&&FACETS.range?+(FACETS.range.total||FACETS.range.n||0):0;
  TOTAL=raw.total!=null?+raw.total:(ftotal||sum(buildMonths().map(m=>m.n)))||0;
  HERO.months=buildMonths();
  HERO.zones=buildZones();
  HERO.no_location=raw.no_location;
  HERO.other_location=raw.other_location;
  HERO.ops=buildOps();
  HERO.op_count=(raw.operators!=null?+raw.operators:0)||facetVals("operator").length||HERO.ops.length;
  HERO.swarm=buildSwarm();
  HERO.swarm_total=raw.swarm_total!=null?+raw.swarm_total:HERO.swarm.length;
  HERO.crew=buildCrew();
  HERO.crew_reports=raw.crew_reports!=null?+raw.crew_reports:sum(HERO.crew.map(c=>c.n));
  HERO.lines=raw.lines||[];
  HERO.specimen=raw.specimen||null;
  HERO.loo=raw.leave_one_out||[];
  if(!active().length)CORPUS=TOTAL||CORPUS;
}
/* The airline ladder read SWAA, DALA, SWIA where the reference reads Southwest
   Airlines Co, Delta Air Lines Inc. This looked the name up in a table filled by
   a boot that no longer runs, so it fell through to the designator every time.
   The controls half builds that list once, from the FAA's own cross-reference;
   opLabel reads it, and it is the one place airline names come from. */
const opName=k=>{
  const o=(HERO&&HERO.ops||[]).find(x=>x.key===String(k));
  if(o&&o.label) return o.label;
  try{ const l=opLabel(String(k)); if(l) return l.replace(/\s*\([^)]*\)\s*$/,""); }catch(e){}
  return gLook(["operator","airline","carrier"],k)||String(k);
};
const crewLabel=c=>{const x=(HERO&&HERO.crew||[]).find(y=>y.code===String(c));
  return (x&&x.label)||crewGloss(c)||("code "+c)};

/* --- aim: the line under the sentence ---------------------------------- */
function aim(html){const a=el("aimLine");if(a)a.innerHTML=html||""}
function unaim(){aim("")}
function opCountOf(k){const o=(HERO&&HERO.ops||[]).find(x=>x.key===String(k));return o?o.n:0}
function tailCountOf(k){const o=(HERO&&HERO.swarm||[]).find(x=>x.key===String(k));return o?o.n:0}
function bandText(lo,hi){
  const ms=HERO?HERO.months:[];const a=ms[lo],b=ms[hi];if(!a||!b)return "";
  const n=sum(ms.slice(Math.min(lo,hi),Math.max(lo,hi)+1).map(x=>x.n));
  return `${monthName(a.m)}${lo===hi?"":" to "+monthName(b.m)} · ${num(n)} reports`;
}
function aimTextFor(spec){
  const d=HERO;if(!d)return "";
  const parts=spec.split("|");const kind=parts[0];
  if(kind==="month"){const m=(d.months||[]).find(x=>x.m===parts[1]);if(!m)return "";
    return `${monthName(parts[1])} · ${num(m.n)} of ${num(m.all)} reports · click to take one month, drag for a period`}
  if(kind==="period")return bandText(+parts[1],+parts[2])+" · release to take it";
  if(kind==="zone"){const z=(d.zones||[]).find(x=>x.code===parts[1]);
    const placed=sum((d.zones||[]).map(x=>x.n));
    return `${zoneLabel(parts[1])}${zoneDesc(parts[1])?" — "+zoneDesc(parts[1]):""} · ${num(z?z.n:0)} of ${num(placed)} placed findings · click to keep only this zone`}
  if(kind==="pad")return parts[1]==="nowhere"
    ? `${num(d.no_location||0)} reports say nothing about where on the aircraft it was, so they cannot be drawn`
    : `${num(d.other_location||0)} reports name the place in words rather than with a zone number, so they cannot be drawn`;
  if(kind==="operator")return `${opName(parts[1])} · ${num(opCountOf(parts[1]))} reports · click to follow this airline`;
  if(kind==="tail")return `N${parts[1]} · ${num(tailCountOf(parts[1]))} reports · click to follow this one airframe`;
  if(kind==="crew"){const c=(d.crew||[]).find(x=>x.code===parts[1]);
    return `${crewLabel(parts[1])} · ${num(c?c.n:0)} reports · click to keep only this`}
  if(kind==="crewall")return `${num(d.crew_reports||0)} of ${num(TOTAL)} reports forced the crew to act`;
  if(kind==="openrail"){const r=RAILS.find(x=>x[0]===parts[1]);return r?`open the ${r[1]} rail — ${r[2]}`:""}
  return "";
}

/* --- taking: one grammar, whole-page consequences ----------------------- */
function pushGo(p){
  const s=p.toString();
  history.pushState({},"",location.pathname+(s?"?"+s:""));
  refresh();
}
function setFilter(k,v,hold){
  const p=params();if(v)p.set(k,v);else p.delete(k);
  PENDING_HOLD=hold||null;pushGo(p);
}
function dropParam(k,hold){
  const p=params();p.delete(k);
  PENDING_HOLD=hold||`dropped ${LABEL[k]||k}. <button class="undoit" type="button">undo</button>`;
  pushGo(p);
}
function applyDates(from,to,hold){
  const p=params();p.set("from",from);p.set("to",to);
  PENDING_HOLD=hold;pushGo(p);
}
function monthTake(m){
  if(!m)return;const [y,mo]=m.split("-").map(Number);
  applyDates(`${m}-01`,`${m}-${pad2(lastDay(y,mo))}`,
    `narrowed to ${monthName(m)}. <button class="undoit" type="button">undo</button>`);
}
function monthsTakeIdx(lo,hi){
  const ms=HERO?HERO.months:[];if(!ms.length)return;
  if(lo>hi){const t=lo;lo=hi;hi=t}
  const a=ms[lo],b=ms[hi];if(!a||!b)return;
  const [y2,m2]=b.m.split("-").map(Number);
  applyDates(`${a.m}-01`,`${b.m}-${pad2(lastDay(y2,m2))}`,
    `narrowed to ${monthName(a.m)}${a.m===b.m?"":" to "+monthName(b.m)}. <button class="undoit" type="button">undo</button>`);
}
function takeFor(spec){
  const parts=String(spec||"").split("|");const kind=parts[0];
  if(kind==="month"){monthTake(parts[1]);return}
  if(kind==="period"){monthsTakeIdx(+parts[1],+parts[2]);return}
  if(kind==="zone"){setFilter("zone",parts[1],
    `kept only what was found in ${zoneLabel(parts[1])}. <button class="undoit" type="button">undo</button>`);return}
  if(kind==="operator"){setFilter("operator",parts[1],
    `following ${opName(parts[1])}. <button class="undoit" type="button">undo</button>`);return}
  if(kind==="tail"){setFilter("tail",parts[1],
    `following N${parts[1]}. <button class="undoit" type="button">undo</button>`);return}
  if(kind==="crew"){setFilter("crew",parts[1],
    `kept only reports where the crew ${crewLabel(parts[1]).toLowerCase()}. <button class="undoit" type="button">undo</button>`);return}
}
function goResults(){
  const t=document.querySelector("table.reports");
  if(t)scrollTo({top:t.getBoundingClientRect().top+scrollY-58,behavior:"smooth"});

/* --- sentences ---------------------------------------------------------- */
function periodClause(p){
  const f=p.get("from"),t=p.get("to");
  if(f&&t){
    if(f===t)return `on ${prettyDate(f)}`;
    if(f.slice(0,7)===t.slice(0,7))return `in ${monthName(f.slice(0,7))}`;
    return `filed ${prettyDate(f)} to ${prettyDate(t)}`;
  }
  if(f)return `filed from ${prettyDate(f)}`;
  if(t)return `filed through ${prettyDate(t)}`;
  return "";
}
function selectionClauses(){
  const p=params();const out=[];
  const per=periodClause(p);if(per)out.push(per);
  if(p.get("q"))out.push(`mentioning &ldquo;${esc(p.get("q"))}&rdquo;`);
  if(p.get("operator"))out.push(`filed by ${esc(opName(p.get("operator")))}`);
  if(p.get("tail"))out.push(`on airframe N${esc(p.get("tail"))}`);
  if(p.get("zone"))out.push(`found in ${esc(zoneLabel(p.get("zone")))}`);
  if(p.get("crew"))out.push(`where the crew ${esc(crewLabel(p.get("crew"))).toLowerCase()}`);
  if(p.get("jasc"))out.push(`on system code ${esc(p.get("jasc"))}`);
  if(p.get("ata"))out.push(`in ATA chapter ${esc(p.get("ata"))}`);
  if(p.get("part"))out.push(`on part ${esc(p.get("part"))}`);
  if(p.get("condition"))out.push(`with condition ${esc(p.get("condition"))}`);
  if(p.get("stage"))out.push(`at stage ${esc(p.get("stage"))}`);
  if(p.get("discovered"))out.push(`discovered ${esc(p.get("discovered"))}`);
  if(p.get("nature"))out.push(`of nature ${esc(p.get("nature"))}`);
  if(p.get("corrosion"))out.push("with corrosion noted");
  if(p.get("cracked"))out.push("with cracking noted");
  if(p.get("make"))out.push(`on aircraft of make ${esc(p.get("make"))}`);
  if(p.get("model"))out.push(`of model ${esc(p.get("model"))}`);
  if(p.get("minhours"))out.push(`at ${esc(p.get("minhours"))} hours`);
  return out;
}
function sentenceHTML(){
  const cls=selectionClauses();const w=TOTAL===1?"report":"reports";
  if(TOTAL===0)return "Nothing matches all of these at once.";
  if(!cls.length)return `Reading <span class="cn">${num(TOTAL)}</span> ${w}.`;
  return `<span class="cn">${num(TOTAL)}</span> ${w} &mdash; ${cls.join(", ")}.`;
}
function clauseText(k,v){
  if(k==="from"||k==="to")return prettyDate(v);
  if(k==="zone")return zoneLabel(v);
  if(k==="operator")return opName(v);
  if(k==="tail")return "N"+v;
  if(k==="crew")return crewLabel(v);
  if(k==="jasc"){const j=jascGloss(v);return j?`${v} ${j}`:v}
  if(k==="q")return `\u201C${v}\u201D`;
  return v;
}

  return active().map(k=>`<span class="chip"><span class="cl">${esc((LABEL[k]||k).toUpperCase())}</span>${esc(clauseText(k,params().get(k)))}<b data-drop="${esc(k)}" title="drop this" tabindex="0" role="button">&times;</b></span>`).join("");

function heldFor(id){
  const p=params();
  if(id==="when")return (p.get("from")&&p.get("to"))?periodShort():"";
  if(id==="where"){const z=p.get("zone");return z?zoneLabel(z):""}
  if(id==="whose"){const o=p.get("operator"),t=p.get("tail");
    return [o?opName(o):"",t?"N"+t:""].filter(Boolean).join(" \u00B7 ")}
  if(id==="forced"){const c=p.get("crew");return c?crewLabel(c):""}

function periodShort(){
  const p=params();const f=p.get("from"),t=p.get("to");
  if(f&&f===t)return prettyDate(f);
  if(f&&t&&f.slice(0,7)===t.slice(0,7))return monthName(f.slice(0,7));
  return `${f?monthName(f.slice(0,7)):"\u2026"} \u2013 ${t?monthName(t.slice(0,7)):"\u2026"}`;
}

  }

function opRow(o,taken){

function tailRow(a,taken){

function bodyWhose(){

    rows.unshift(opRow({key:cur,label:opName(cur),n:f.n||0,_mx:1,_pinned:true},true));

/* --- the when rail's small mechanics ------------------------------------ */
function axisTicks(){
  const track=el("whenTrack"),axis=el("whenAxis"),ms=HERO?HERO.months:[];
  if(!track||!axis||!ms.length)return;
  const w=track.scrollWidth;if(!w)return;
  const per=w/ms.length;
  const every=Math.max(1,Math.ceil(46/(per*12)));
  const first=+ms[0].m.slice(0,4);
  const spans=[];
  ms.forEach((m,i)=>{if(!m.m.endsWith("-01"))return;
    const y=+m.m.slice(0,4);
    if((y-first)%every===0)spans.push(`<span style="left:${((i+.5)/ms.length*100).toFixed(3)}%">${y}</span>`)});
  axis.innerHTML=spans.join("");
}
function clearBand(){
  document.querySelectorAll("#months .mo.inband").forEach(x=>x.classList.remove("inband"));
}
function paintBandIdx(i,j){
  const ms=HERO?HERO.months:[];if(!ms.length)return;
  const lo=Math.min(i,j),hi=Math.max(i,j);
  const mos=document.querySelectorAll("#months .mo");
  mos.forEach((n,k)=>n.classList.toggle("inband",k>=lo&&k<=hi));
  aim(`${bandText(lo,hi)} &middot; release to take it`);
}
function monthIdxAt(clientX){
  const track=el("whenTrack");if(!track)return -1;
  const ms=HERO?HERO.months:[];if(!ms.length)return -1;
  const r=track.getBoundingClientRect();
  const x=Math.min(Math.max(clientX-r.left+track.scrollLeft,0),track.scrollWidth-1);
  return Math.min(ms.length-1,Math.floor(x/(track.scrollWidth/ms.length)));
}

/* --- the typed route -----------------------------------------------------
   everything the pointer can reach, reachable by typing its name: the marks
   the data actually holds are offered with their counts before you commit. */
function buildSugSrc(){
  SUGSRC=[];
  if(!HERO)return;
  (HERO.months||[]).forEach(m=>SUGSRC.push({kind:"period",label:monthName(m.m),take:"month|"+m.m,n:m.n}));
  (HERO.zones||[]).forEach(z=>SUGSRC.push({kind:"zone",label:zoneLabel(z.code),take:"zone|"+z.code,n:z.n}));
  (HERO.crew||[]).forEach(c=>SUGSRC.push({kind:"crew",label:c.label,take:"crew|"+c.code,n:c.n}));
  (HERO.ops||[]).slice(0,60).forEach(o=>SUGSRC.push({kind:"operator",label:o.label||opName(o.key),take:"operator|"+o.key,n:o.n}));
  (HERO.swarm||[]).slice(0,60).forEach(a=>SUGSRC.push({kind:"tail",label:"N"+a.key,take:"tail|"+a.key,n:a.n}));
}
function sugClose(){
  const box=el("aimSug");if(box){box.hidden=true;box.innerHTML=""}
  SUG=[];SUGI=-1;
  const i=el("aimAt");if(i)i.setAttribute("aria-expanded","false");
}
function sugPaint(){
  const box=el("aimSug");if(!box)return;
  if(!SUG.length){sugClose();return}
  let last=null;
  box.innerHTML=SUG.map((o,i)=>{
    const head=o.kind!==last?`<div class="sughead">${esc(KINDLAB[o.kind]||o.kind)}</div>`:"";
    last=o.kind;
    return head+`<div class="sug${i===SUGI?" on":""}" role="option" aria-selected="${i===SUGI}" data-i="${i}">
      <span class="sl">${esc(o.label)}</span><span class="sw">${esc(o.what||"")}</span><b>${num(o.n)}</b></div>`;
  }).join("");
  box.hidden=false;
  const inp=el("aimAt");if(inp)inp.setAttribute("aria-expanded","true");
}
function sugQuery(v){
  v=v.trim().toLowerCase();if(v.length<2){sugClose();return}
  SUG=SUGSRC.filter(o=>o.label.toLowerCase().includes(v)).slice(0,40)
    .map(o=>({kind:o.kind,label:o.label,take:o.take,n:o.n,
      what:o.kind==="period"?"month":o.kind==="zone"?"zone":o.kind==="crew"?"crew action":o.kind==="operator"?"airline":o.kind==="tail"?"one airframe":""}));
  SUGI=-1;sugPaint();
}
function takeSug(o){
  if(!o)return;sugClose();takeFor(o.take);
}
function aimPlaceholder(){
  const k=(el("aimKind")&&el("aimKind").value)||"";
  const i=el("aimAt");if(i)i.placeholder=AIMPH[k]||"";
}
function monthIndexFromName(s){
  s=String(s).trim().toLowerCase();
  if(s.length<3)return 0;
  for(let i=1;i<=12;i++){const n=MONTHS[i].toLowerCase();
    if(s===n||(n.startsWith(s)&&s.length>=3))return i}
  return 0;
}
function mkPeriod(loM,hiM,label){
  const [y1,m1]=loM.split("-").map(Number),[y2,m2]=hiM.split("-").map(Number);
  return {lo:`${loM}-01`,hi:`${hiM}-${pad2(lastDay(y2,m2))}`,label,
    _y1:y1,_m1:m1};
}
function parsePeriod(v){
  v=String(v).trim().toLowerCase().replace(/\./g,"");
  let m;
  if((m=v.match(/^(\d{4})$/)))return mkPeriod(m[1]+"-01",m[1]+"-12",m[1]);
  if((m=v.match(/^(\d{4})-(\d{1,2})$/))){const y=m[1],mo=+m[2];
    if(mo<1||mo>12)return null;return mkPeriod(`${y}-${pad2(mo)}`,`${y}-${pad2(mo)}`,`${MONTHS[mo]} ${y}`)}
  let name=null,year=null;
  if((m=v.match(/^([a-z]{3,})\s*,?\s*(\d{4})$/))){name=m[1];year=m[2]}
  else if((m=v.match(/^(\d{4})\s+([a-z]{3,})$/))){name=m[2];year=m[1]}
  if(name){
    const mi=monthIndexFromName(name);
    if(mi&&year)return mkPeriod(`${year}-${pad2(mi)}`,`${year}-${pad2(mi)}`,`${MONTHS[mi]} ${year}`);
  }
  const mi=monthIndexFromName(v);
  if(mi){let best=null;
    TREND_ALL.forEach(r=>{const k=String(r.month||r.m||r.date);
      if(+k.slice(5,7)===mi&&(!best||k>best))best=k});
    if(best){const y=best.slice(0,4);
      return mkPeriod(best,best,`${MONTHS[mi]} ${y}`)}
  }
  return null;
}
function clampPeriod(pr){
  if(RANGE.from&&RANGE.to){
    const clo=pr.lo<RANGE.from?RANGE.from:pr.lo,chi=pr.hi>RANGE.to?RANGE.to:pr.hi;
    if(clo<=chi){pr.lo=clo;pr.hi=chi}
  }
  return pr;
}
function aimGoGo(){
  const inp=el("aimAt");if(!inp)return;
  const raw=(inp.value||"").trim();if(!raw)return;
  const kind=(el("aimKind")&&el("aimKind").value)||"";
  if(!kind){
    setFilter("q",raw,`searched the write-ups for &ldquo;${esc(raw)}&rdquo;. <button class="undoit" type="button">undo</button>`);
    inp.value="";return;
  }
  if(kind==="period"){
    const pr=parsePeriod(raw);
    if(!pr){aim(`I cannot read &ldquo;${esc(raw)}&rdquo; as a month or a year. Try &ldquo;August 2025&rdquo; or &ldquo;2025&rdquo;.`);return}
    clampPeriod(pr);
    applyDates(pr.lo,pr.hi,`narrowed to ${esc(pr.label)}. <button class="undoit" type="button">undo</button>`);
    inp.value="";return;
  }
  let v=raw;
  if(kind==="tail")v=raw.replace(/^N/i,"").toUpperCase();
  if(kind==="zone"||kind==="jasc")v=raw.replace(/[^0-9]/g,"")||raw;
  setFilter(kind,v,`took &ldquo;${esc(raw)}&rdquo; as ${LABEL[kind]||kind}. <button class="undoit" type="button">undo</button>`);
  inp.value="";
}

/* --- the touch pill: first tap aims, second takes ------------------------ */

/* --- binding: everything delegated once, against a re-rendered DOM ------- */
let BOUND=false;
function bindGlobal(){
  if(BOUND)return;BOUND=true;
  document.addEventListener("mouseover",e=>{
    const t=e.target.closest&&e.target.closest("[data-aim]");if(!t)return;
    const txt=aimTextFor(t.dataset.aim);if(txt)aim(txt);
  });
  document.addEventListener("focusin",e=>{
    const t=e.target.closest&&e.target.closest("[data-aim]");
    if(t){const txt=aimTextFor(t.dataset.aim);if(txt)aim(txt)}
    const mo=e.target.closest&&e.target.closest("#months .mo");
    if(mo){
      if(MO_ROVE&&MO_ROVE!==mo)MO_ROVE.setAttribute("tabindex","-1");
      mo.setAttribute("tabindex","0");MO_ROVE=mo;
    }
  });
  document.addEventListener("mouseout",e=>{
    if(e.target.closest&&e.target.closest("[data-aim]"))unaim();
  });

  document.addEventListener("click",e=>{
    if(e.target.closest&&e.target.closest(".undoit")){history.back();return}
    if(e.target.closest&&e.target.closest("[data-retry]")){refresh();return}
    if(e.target.closest&&e.target.closest("#seamGo")){goResults();return}
    const dr=e.target.closest&&e.target.closest("[data-drop]");
    if(dr){dropParam(dr.dataset.drop);return}
    const pk=e.target.closest&&e.target.closest(".picker button[data-rail]");
    if(pk){setRail(pk.dataset.rail);return}
    const rc=e.target.closest&&e.target.closest(".rail.closed");
    if(rc){setRail(rc.dataset.rail);return}
    const tk=e.target.closest&&e.target.closest("[data-take]");
    if(tk){
      if(COARSE.matches){killPill();pillFor(tk.dataset.take,(aimTextFor(tk.dataset.take)||"this mark").replace(/\s*\u00B7[^·]*$/,""));return}
      takeFor(tk.dataset.take);return;
    }
  });

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){sugClose();if(DRAG){DRAG=null}clearBand();killPill();return}
    const mo=e.target.closest&&e.target.closest("#months .mo");
    const cont=e.target.closest&&e.target.closest("#months");
    if((mo||cont)&&["ArrowLeft","ArrowRight","Home","End"].includes(e.key)){
      e.preventDefault();
      const mos=[...document.querySelectorAll("#months .mo")];if(!mos.length)return;
      let i=mo?mos.indexOf(mo):mos.length-1;
      const j=e.key==="ArrowLeft"?Math.max(0,i-1):e.key==="ArrowRight"?Math.min(mos.length-1,i+1)
        :e.key==="Home"?0:mos.length-1;
      if(e.shiftKey&&ANCHOR===null)ANCHOR=i;
      if(!e.shiftKey)ANCHOR=null;
      mos[j].focus();
      if(e.shiftKey&&ANCHOR!==null)paintBandIdx(ANCHOR,j);
      return;
    }
    if((mo||cont)&&(e.key==="Enter"||e.key===" ")){
      e.preventDefault();
      const mos=[...document.querySelectorAll("#months .mo")];if(!mos.length)return;
      const i=mo?mos.indexOf(mo):mos.length-1;
      if(ANCHOR!==null){monthsTakeIdx(ANCHOR,i);ANCHOR=null;clearBand()}
      else monthTake((HERO.months[i]||{}).m);
      return;
    }
    if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("zone")
       &&e.target.dataset&&e.target.dataset.take){
      e.preventDefault();
      if(COARSE.matches)killPill();
      takeFor(e.target.dataset.take);return;
    }
    if(e.target.id==="aimAt"&&SUG.length){
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){
        e.preventDefault();
        SUGI=e.key==="ArrowDown"?Math.min(SUG.length-1,SUGI+1):Math.max(-1,SUGI-1);
        sugPaint();
      }else if(e.key==="Enter"&&SUGI>=0){
        e.preventDefault();takeSug(SUG[SUGI]);
      }
    }
  });

  document.addEventListener("pointerdown",e=>{
    const m=e.target.closest&&e.target.closest("#months .mo");
    if(!m||!el("months"))return;
    if(!COARSE.matches)e.preventDefault();
    const mos=[...document.querySelectorAll("#months .mo")];
    const i=mos.indexOf(m);if(i<0)return;
    DRAG={a:i,b:i};
    paintBandIdx(i,i);
  });
  document.addEventListener("pointermove",e=>{
    if(!DRAG)return;
    const i=monthIdxAt(e.clientX);if(i<0)return;
    if(i!==DRAG.b){DRAG.b=i;paintBandIdx(DRAG.a,i)}
  });
  document.addEventListener("pointerup",e=>{
    if(!DRAG)return;
    const a=DRAG.a,b=DRAG.b;DRAG=null;
    const lo=Math.min(a,b),hi=Math.max(a,b);
    if(COARSE.matches){
      clearBand();
      pillFor(`period|${lo}|${hi}`,bandText(lo,hi));
    }else{
      clearBand();monthsTakeIdx(lo,hi);
    }
  });
  document.addEventListener("pointercancel",()=>{DRAG=null;clearBand()});

  document.addEventListener("input",e=>{
    if(!e.target||e.target.id!=="aimAt")return;
    const v=e.target.value.trim();
    clearTimeout(sugTimer);
    if(v.length<2){sugClose();return}
    sugTimer=setTimeout(()=>sugQuery(v),160);
  });
  document.addEventListener("mousedown",e=>{
    const row=e.target.closest&&e.target.closest("#aimSug .sug");
    if(row){e.preventDefault();takeSug(SUG[+row.dataset.i]);return}
    if(!e.target.closest||!e.target.closest(".aimat"))sugClose();
  });
  document.addEventListener("click",e=>{
    if(e.target.closest&&e.target.closest("#aimGo")){aimGoGo();return}
    if(e.target.id==="aimAt"&&e.target.select)e.target.select();
  });
  document.addEventListener("keydown",e=>{
    if(e.target&&e.target.id==="aimAt"&&e.key==="Enter"){
      e.preventDefault();
      if(SUGI<0)aimGoGo();
    }
  });
  document.addEventListener("change",e=>{
    if(e.target&&e.target.id==="aimKind"){
      aimPlaceholder();sugClose();
      const v=(el("aimAt").value||"").trim();
      if(v.length>=2)sugQuery(v);
    }
    if(e.target&&e.target.id==="aimDay"){
      const d=e.target.value;if(!d)return;
      applyDates(d,d,`took ${prettyDate(d)}, one day. <button class="undoit" type="button">undo</button>`);
    }
  });

  addEventListener("scroll",()=>{killPill()},{passive:true});
  addEventListener("resize",()=>{clearTimeout(window._heroRz);
    window._heroRz=setTimeout(()=>{axisTicks()},180)});
  addEventListener("popstate",()=>{
    RAIL=params().get("hero")||RAIL;PENDING_HOLD=null;refresh();
  });
}

/* --- refresh: read the file again, then redraw --------------------------- */
function setBusy(b){const i=el("ipad");if(i)i.classList.toggle("busy",b)}
async function refresh(){
  const mine=++SEQ;
  setBusy(true);
  try{
    const [f,ts,h]=await Promise.all([api("facets"),api("trend"),api("hero?hero="+encodeURIComponent(RAIL))]);
    if(mine!==SEQ)return;
    FACETS=f;HERO={trendSel:ts};
    composeHero(h);
    drawInstrument(ROOT,RAIL,HERO.raw);
    window.dispatchEvent(new CustomEvent("sdr:change",{detail:{rail:RAIL,total:TOTAL,params:Object.fromEntries(params())}}));
  }catch(err){
    if(mine===SEQ)drawFrame("fault");
  }finally{
    if(mine===SEQ)setBusy(false);
  }
}
function setRail(r){
  if(!RAILS.some(x=>x[0]===r)||r===RAIL)return;
  RAIL=r;PENDING_HOLD=null;
  const p=params();p.set("hero",r);pushGo(p);
}

/* --- the instrument itself ----------------------------------------------
   drawInstrument(rootEl, rail, data): renders the whole instrument into
   rootEl from data (an api/hero answer). Called by refresh after every
   fetch, and safe to call from outside with your own data. */
function drawInstrument(rootEl,rail,data){
  if(!rootEl)return;
  ROOT=rootEl;
  if(RAILS.some(x=>x[0]===rail))RAIL=rail;
  LOADING=(data==null);
  if(LOADING){composeHero(null);drawFrame("loading");return}
  composeHero(data);
  if(HERO.refused){drawFrame("refused");return}
  buildMargins();

/* --- boot ---------------------------------------------------------------- */
async function boot(){
  /* superseded by the 03-rails instrument, which is built to the written
   specification and covers all four rails. Left in place, not deleted, so
   the two can be compared. */
  ROOT=el("hero-root-superseded");if(!ROOT)return;
  bindGlobal();
  /* The parent opens on the aircraft, and says why: a reader who has chosen
   nothing still learns something from a shape. A remembered rail does not
   win; only the address bar does. */
  RAIL=params().get("hero")||"where";
  drawInstrument(ROOT,RAIL,null); /* the frame stands while the file is read */
  try{TREND_ALL=asRows(await plain("api/trend"),"trend")}catch(e){TREND_ALL=[]}
  CORPUS=sum(TREND_ALL.map(r=>+(r.n??r.count??0)));
  await refresh();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();

/* =========================================================================
   WHERE rail — "on the aircraft".  Replaces ZONE_ORDER / buildZones / acSVG /
   zonenoteHTML / bodyWhere by redeclaration (paste AFTER the old ones), and
   adds the legend, reading sentence, phone grid, aim text and the
   row -> aircraft reverse link.

   THE TRAP, FIXED: the API's zone codes are PREFIXED — 'ZONE 200', never
   '200'.  Every Map key, every data-aim/data-take and every filter value
   therefore carries the prefix, so the server accepts zone=ZONE%20200 and
   the counts land on the shapes.
   ========================================================================= */

/* fixed order from the server's _ZONE_ORDER: frequency-ish, NOT numeric,
   NOT re-sorted here; legend ties keep this order (stable sort) */
const WHERE_ZONE_ORDER=["ZONE 200","ZONE 100","ZONE 800","ZONE 300","ZONE 500",
                        "ZONE 600","ZONE 400","ZONE 700","ZONE 900"];

/* 'ZONE 200' | 'ZN 200' | 'zone 200' -> 'ZONE 200'; ZONE 000 and junk -> null */
const zNorm=v=>{const m=/^Z(?:ONE|N)?\s*([1-9])00$/i.exec(String(v==null?"":v).trim());
  return m?("ZONE "+m[1]+"00"):null};

const whereD=()=>HERO.raw||HERO||{};
const zByCode=c=>(HERO.zones||[]).find(z=>z.code===c)||null;
const zCount=c=>{const z=zByCode(c);return z?(+z.n||0):0};
const zLabel=c=>{const z=zByCode(c);
  return (z&&z.label)?z.label:("ZONE "+String(c).replace(/^ZONE\s+/i,""))};

/* THE RAMP — one function, no second colour.  Linear in the raw count,
   rescaled on EVERY render against the current selection's own busiest
   zone; pure opacity of --rust #c44b28 over --paper #f7f5f0. */
const zMax=()=>Math.max(1,...(HERO.zones||[]).map(z=>+z.n||0));
const zFill=(n,mx)=>`rgba(196,75,40,${(0.10+0.80*(n/mx)).toFixed(3)})`;

function buildZones(){
  const src=(HERO.raw&&HERO.raw.zones)?HERO.raw.zones:facetVals("zone");
  const by=new Map();
  (src||[]).forEach(z=>{
    const code=zNorm(z.code??z.zone??z.value);
    if(!code)return;                                  /* ZONE 000 never enters */
    by.set(code,{code,n:+(z.n??z.count??0)||0,label:String(z.label??z.name??"")});
  });
  /* the label the API sends is authoritative (the FAA's own code table);
     glossary, then "ZONE xxx", only for a facet that shipped no label */
  return WHERE_ZONE_ORDER.map(c=>{
    const z=by.get(c), bare=c.slice(5);
    return {code:c,n:z?z.n:0,
            label:(z&&z.label)?z.label:(zoneGloss(bare)||("ZONE "+bare))};
  });
}

function acSVG(){
  const mx=zMax(), taken=params().get("zone");
  const f=c=>zFill(zCount(c),mx);
  /* the aircraft only ever renders inside the open rail, so tabindex is 0 */
  const atr=c=>`class="zone${taken===c?" taken":""}" data-aim="zone|${c}" data-take="zone|${c}" tabindex="0" role="button" aria-label="${esc(zLabel(c))}, ${num(zCount(c))} reports"`;
  /* the trailing-b strip lets ONE zone be two disjoint paths: "ZONE 300b"
     never comes from the API — it resolves to ZONE 300 and shares
     fill/aim/take/tabindex/label, while staying its own Tab stop */
  const shape=(c0,d)=>{const c=c0.replace(/b$/,"");
    return `<path d="${d}" fill="${f(c)}" stroke="#7c746a" stroke-width="1.1" ${atr(c)}/>`};
  return `<svg viewBox="0 0 600 132" class="plane" role="img" aria-label="Aircraft from the side, each zone shaded by how many reports name it">`
    +shape("ZONE 100","M30 66 C30 80 47 88 80 88 L470 88 C495 86 513 80 529 72 L502 66 Z")
    +shape("ZONE 200","M30 66 C30 52 47 44 80 44 L452 44 C481 44 503 36 541 18 L557 14 C541 40 525 58 512 66 Z")
    +shape("ZONE 300","M452 44 L492 7 L518 7 L523 41 Z")
    +shape("ZONE 300b","M512 48 L578 38 L580 47 L516 57 Z")
    +shape("ZONE 500","M236 87 L356 87 L318 108 L264 108 Z")
    +shape("ZONE 600","M262 80 L344 80 L322 90 L284 90 Z")
    +`<ellipse cx="248" cy="99" rx="24" ry="9.5" fill="${f("ZONE 400")}" stroke="#7c746a" stroke-width="1.1" ${atr("ZONE 400")}/>`
    /* struts are ONE two-subpath path in strut grey, unfilled, UNSHADED;
       only the three wheels take the zone fill */
    +`<g ${atr("ZONE 700")} stroke="#7c746a"><path d="M118 88 L118 104 M288 88 L288 106" stroke="#8d857b" stroke-width="3" fill="none"/><circle cx="118" cy="109" r="6" fill="${f("ZONE 700")}"/><circle cx="281" cy="111" r="7" fill="${f("ZONE 700")}"/><circle cx="297" cy="111" r="7" fill="${f("ZONE 700")}"/></g>`
    +`<g ${atr("ZONE 800")} stroke="#7c746a">${[96,190,348,424].map(x=>`<rect x="${x}" y="49" width="11" height="17" rx="3" fill="${f("ZONE 800")}"/>`).join("")}</g>`
    +`<g ${atr("ZONE 900")} stroke="#7c746a">${[122,372].map(x=>`<rect x="${x}" y="51" width="22" height="14" rx="3" fill="${f("ZONE 900")}"/>`).join("")}</g>`
    /* windows: decoration, drawn LAST so they sit above the shading, and
       pointer-events:none so they never swallow a hover meant for the crown */
    +`<g fill="#f7f5f0" stroke="none" opacity=".8" pointer-events="none">${[150,164,220,234,248,300,314,328,400,414].map(x=>`<rect x="${x}" y="54" width="6" height="7" rx="2"/>`).join("")}</g>`
    +`</svg>`;
}

function zonesDesc(){
  const zs=(HERO.zones||[]).map((z,i)=>({z,i}));
  zs.sort((a,b)=>((+b.z.n||0)-(+a.z.n||0))||(a.i-b.i));  /* stable: ties keep WHERE_ZONE_ORDER */
  return zs.map(x=>x.z);
}

function legendHTML(){
  const D=whereD(), mx=zMax(), taken=params().get("zone");
  const rows=zonesDesc().map(z=>
    `<div class="lrow zone${taken===z.code?" taken":""}" data-aim="zone|${z.code}" data-take="zone|${z.code}" tabindex="0" role="button">`
    +`<i style="background:${zFill(z.n,mx)}"></i><span>${esc(z.label)}</span><b>${num(z.n)}</b></div>`).join("");
  /* pads carry data-aim but NO data-take: clicking one does nothing but
     leave the explanation on screen — they are unshadeable by construction */
  const pads=
    `<div class="lrow zone" data-aim="pad|nowhere" tabindex="0" role="button"><i class="padi"></i><span>no location given</span><b>${num(+(D.no_location??0)||0)}</b></div>`
   +`<div class="lrow zone" data-aim="pad|outside" tabindex="0" role="button"><i class="padi"></i><span>place named in words, not as a zone</span><b>${num(+(D.other_location??0)||0)}</b></div>`;
  return rows+`<div class="lsplit"></div>`+pads;
}

/* This used to read 'the others never say where', which was false: they nearly all say
   where, in words the diagram cannot place. Only the blank ones say nothing, and they are
   about one report in twenty-seven, not four fifths of the file. */
/* Zonder deze zin leest de alinea als een reeks voorbehouden. De tekening is een steekproef,
   maar wel een die laat zien waar het meeste stukgaat. */
function zonenoteHTML(){
  const D=whereD();
  const placed=(HERO.zones||[]).reduce((s,z)=>s+(+z.n||0),0);
  const unz=D.unzoned!=null?+D.unzoned:Math.max(0,((+(D.total??TOTAL)||0))-placed);
  if(!(unz>0))return "";
  return `<div class="zonenote">The aircraft above counts only the ${num(placed)} reports that use one of the FAA's numbered zones. In another ${num(+(D.other_location??0)||0)} the mechanic wrote where it was in plain words, such as the part or the system, and ${num(+(D.no_location??0)||0)} say nothing about where. Those two cannot be drawn on the aircraft, so they sit under it.</div>`;
}

const wherePct=(a,b)=>b>0?(Math.round(a/b*1000)/10).toFixed(1):"0.0";

function whereReadingHTML(){
  const D=whereD(), zs=zonesDesc(), tot=+(D.total??TOTAL)||0;
  if(!tot||!zs.length)return "";
  const zoned=zs.reduce((s,z)=>s+(+z.n||0),0);
  const worded=+(D.other_location??0)||0, blank=+(D.no_location??0)||0;
  let t=`${esc(zs[0].label)} accounts for ${num(zs[0].n)} of the ${num(zoned)} reports written in the FAA&rsquo;s numbered zones, or ${wherePct(zs[0].n,zoned)}%. Those numbers are what this diagram can place, and they are ${wherePct(zoned,tot)}% of the selection.`;
  if(worded)t+=` Another ${num(worded)} do say where, in words such as FUSELAGE or CABIN rather than a zone number, so the drawing cannot show them.`;
  if(blank)t+=` Only ${num(blank)}, ${wherePct(blank,tot)}%, give no location at all.`;
  t+=` It is a sample rather than the whole file, but it does give you a good idea of where the trouble sits.`;
  return `<div class="reading">${t}</div>`;
}

function whereVal(){
  const v=params().get("zone");
  if(!v)return "all zones";
  const z=zByCode(v);
  return (z&&z.label)?z.label:v;
}

function restWhere(){
  const taken=params().get("zone");
  const strip=zonesDesc().map(z=>
    `<span style="flex:${Math.max(1,z.n)}" title="${esc(z.label)}: ${num(z.n)}"${taken===z.code?' class="sel"':""}></span>`).join("");
  return `<div class="rail" data-rail="where" onclick="setHero('anatomy')">`
       +`<div class="gut rest"><span class="q">WHERE</span><span class="val">${esc(whereVal())}</span></div>`
       +`<div class="track"><div class="strip">${strip}</div></div></div>`;
}

function phZones(){
  const D=whereD(), mx=zMax(), taken=params().get("zone");
  const grid=[["ZONE 800","ZONE 200","ZONE 100"],        /* spatial, NOT frequency-sorted */
              ["ZONE 500","ZONE 400","ZONE 600"],
              ["ZONE 300","ZONE 700","ZONE 900"]];
  const cell=c=>{const n=zCount(c);
    return `<button type="button" class="phcell${taken===c?" taken":""}" style="--f:${(0.10+0.80*(n/mx)).toFixed(3)}" data-aim="zone|${c}" data-take="zone|${c}" aria-label="${esc(zLabel(c))}, ${num(n)} reports">${esc(zLabel(c))}<b>${num(n)}</b></button>`};
  const pad=(k,txt,n)=>
    `<button type="button" class="phcell pad" data-aim="pad|${k}" aria-label="${esc(txt)}">${esc(txt)}<b>${num(n||0)}</b></button>`;
  return `<div class="phgrid">${grid.flat().map(cell).join("")}`
       +pad("nowhere","no location given",+(D.no_location??0)||0)
       +pad("outside","place named in words, not as a zone",+(D.other_location??0)||0)
       +`</div>`;
}

function bodyWhere(){
  const narrow=window.matchMedia&&matchMedia("(max-width:760px)").matches;
  if(narrow)return `<div class="track">${phZones()}</div>`;  /* no reading, no zonenote on the phone */
  return `<div class="track two">${acSVG()}<div>${legendHTML()}${zonenoteHTML()}</div></div>`
       +whereReadingHTML();
}

/* row -> aircraft.  A row's data-zone comes from
   (PartLocation||"").toUpperCase().match(/^ZONE \d00/) and that client regex
   is stricter than the server's: it needs the literal word "ZONE ", so a row
   reading "ZN 100 FUS LOWER" lights nothing even though the server counted it. */
function heroMark(row){
  const v=row&&(row.dataset?row.dataset.zone:(row.getAttribute?row.getAttribute("data-zone"):null));
  const m=/^ZONE \d00/.exec(String(v==null?"":v).toUpperCase());
  unmarkZones();
  if(m)document.querySelectorAll(`[data-take="zone|${m[0]}"],[data-aim="zone|${m[0]}"]`)
    .forEach(n=>n.classList.add("lit"));  /* querySelectorAll on purpose: aircraft AND legend, both ZONE 300 paths */
}
function unmarkZones(){
  document.querySelectorAll(".zone.lit,.lrow.lit,.phcell.lit").forEach(n=>n.classList.remove("lit"));
}

function whereAim(key){
  if(key&&key.slice(0,5)==="zone|"){
    const c=key.slice(5);
    const placed=(HERO.zones||[]).reduce((s,z)=>s+(+z.n||0),0); /* recomputed from zones, never read off unzoned */
    return `${esc(zLabel(c))} &middot; ${num(zCount(c))} of ${num(placed)} placed findings &middot; click to narrow`;
  }
  const D=whereD();
  if(key==="pad|nowhere")return `${num(+(D.no_location??0)||0)} reports say nothing about where on the aircraft it was, so they cannot be drawn on the aircraft`;
  if(key==="pad|outside")return `${num(+(D.other_location??0)||0)} reports describe the place in words rather than with an FAA zone number, so they cannot be drawn on the aircraft`;
  return null;
}

/* hover/focus aim, delegated on document, installed once.  Clicks and keys
   are deliberately NOT bound here: the page's own takeFor delegation already
   fires (it is what produced the rejected zone=100 request), and a second
   binding would run every search twice and break history-based undo. */
if(!window.__WHERE_AIM__){
  window.__WHERE_AIM__=true;
  const hit=e=>{
    const n=e.target&&e.target.closest?e.target.closest("[data-aim]"):null;
    if(!n||(e.relatedTarget&&n.contains(e.relatedTarget)))return;
    const t=whereAim(n.getAttribute("data-aim"));
    if(t!=null)aim(t);
  };
  const miss=e=>{
    const n=e.target&&e.target.closest?e.target.closest("[data-aim]"):null;
    if(!n||(e.relatedTarget&&n.contains(e.relatedTarget)))return;
    if(whereAim(n.getAttribute("data-aim"))!=null)aim("");
  };
  document.addEventListener("pointerover",hit);
  document.addEventListener("pointerout",miss);
  document.addEventListener("focusin",hit);
  document.addEventListener("focusout",miss);
}

/* phone <-> aircraft swap without a reload */
try{
  const mq=matchMedia("(max-width:760px)");
  const swap=()=>{if(typeof drawHero==="function"&&document.querySelector('.rail.open[data-rail="where"]'))drawHero()};
  if(mq.addEventListener)mq.addEventListener("change",swap);
  else if(mq.addListener)mq.addListener(swap);
}catch(_){}

.orow.wide{grid-template-columns:190px minmax(0,1fr) 56px;height:17px}
.orow.wide .on{font-size:12px}

.restbar{height:6px;background:#e8e3d8;border-radius:3px;overflow:hidden}
.restbar i{display:block;height:100%;background:var(--rust)}
.fblock{position:relative;height:22px;background:#e8e3d8;border-radius:3px;overflow:hidden;display:flex;align-items:center;margin-bottom:6px}
.fblock i{position:absolute;left:0;top:0;bottom:0;background:var(--rust)}
.fblock .flab{position:relative;padding-left:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink)}
.fnote{font-size:11px;color:var(--ash);margin-top:4px}

.reading{margin:9px 0 0;padding:8px 12px 8px 13px;border-left:2px solid var(--rust);background:#faf7f3;font:15px/1.5 Georgia,'Times New Roman',serif;max-width:74ch}
.margin{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ash);line-height:1.5}
.margin .mr{color:var(--rust-text)}
.hint{margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ash)}

.specimen{margin-top:14px;padding:6px 0}
.specimen .sh{font:12px/1.5 Archivo,'Helvetica Neue',sans-serif;color:var(--smoke)}
.specimen .opencue{color:var(--rust-text);white-space:nowrap}
.spec-decoded{font:600 12.5px/1.5 Archivo,'Helvetica Neue',sans-serif;color:var(--rust-text,#a3421f);margin:2px 0 3px;letter-spacing:.01em}
.specimen .sl{font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5;color:#403b35;margin-top:3px;-webkit-line-clamp:2;-webkit-box-orient:vertical;display:-webkit-box;overflow:hidden}
.specimen.opens{cursor:pointer;border-radius:5px;margin:0 -8px;padding:4px 8px 5px}
.specimen.opens:hover,.specimen.opens:focus-visible{background:#f3efe8}
.specimen.opens:focus-visible{outline:2px solid var(--rust)}
.zero{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:10px 14px;margin:0 0 10px}
.zero .zghost{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ash);margin-top:4px}
tr.spine.lit td,tr[data-month].lit td{background:#fbe6dc}

/* The reference drops the drawing out of its two columns near 960, not 760.
   Held to 760 the aircraft got whatever the 330px legend left over: 312px at a
   900px window against the reference's 640, a third of the picture. */
@media(max-width:960px){
  .rail .track.two{grid-template-columns:minmax(0,1fr)}
  .rail>.reading{grid-column:1}
}
@media(max-width:760px){
  .rail{grid-template-columns:minmax(0,1fr)}
  .rail>.track,.rail>.hint,.rail>.reading,.rail>.margin{grid-column:1}
  .orow,.orow.wide{grid-template-columns:100px minmax(0,1fr) 46px}
}
@media(max-width:479px){.specimen{display:none}}

/* ---------------- aim line ---------------- */

/* ---------------- routing: both spellings accepted ---------------- */
function heroKey(){
  var AL={when:"when",horizon:"when",where:"where",anatomy:"where",whose:"whose",who:"whose",swarm:"whose",forced:"forced",ledger:"forced"};
  return AL[params().get("hero")]||"where";
}
function setHero(key){
  var AL={when:"when",horizon:"when",where:"where",anatomy:"where",whose:"whose",who:"whose",swarm:"whose",forced:"forced",ledger:"forced"};
  var p=params(); p.set("hero",AL[key]||"where");
  history.pushState(null,"",location.pathname+"?"+p.toString());
  if(heroData) drawHero(heroData); else loadHero();

/* ---------------- load ---------------- */
function loadHero(){
  var seq=++heroSeq;
  HERO_FOR=filterQS();
  var q=filterQS();
  fetch("api/hero"+(q?"?"+q:""),{headers:{accept:"application/json"}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ if(seq===heroSeq) drawHero(d||null); })
    .catch(function(){ if(seq===heroSeq) drawHero(null); });
}
function runSearch(pg){ if(typeof search==="function") search(pg); else loadHero(); }

/* ---------------- render ---------------- */
function drawHero(d, phone){
  var host=heroEl(); if(!host) return;
  if(!d){ host.innerHTML=skeletonHTML(); return; }
  heroData=d;
  /* The file's real end is sent: span.to, and lag.file_to beside it. Falling
     back to the last day of the last month turned 26 August into 31 August, so
     the standing sentence promised five days of reports that do not exist. The
     same shape of error as captioning a selection "1 Jan to 31 Dec" over a count
     that stopped in August. Guessed only when nothing is sent. */
  /* This is the FILE's extent, not the selection's, and the two are different
     things. span is the selection: with a zone filter it starts at that zone's
     first report, and reading it here made January 1995 look like a part month
     and print "covers 1 to 31 January, 31 days against 31".
     lag.file_to is the file's end whatever is filtered, and the months array is
     always the whole corpus, so its first entry is the file's start. */
  heroRange=d.range||{
    from:(d.months&&d.months.length)?d.months[0].m+"-01":((d.span&&d.span.from)||null),
    to:(d.lag&&d.lag.file_to)||d.published||d.asof||
       ((d.months&&d.months.length)?d.months[d.months.length-1].m+"-"+String(lastDay(d.months[d.months.length-1].m)).padStart(2,"0"):null)
  };
  var openKey=heroKey(), nar=narrowed(), h="";
  if((d.total||0)===0) h+=zeroHTML(d);
  /* the stamp carries the span, so a reader knows what the page can answer for
     before reading a number. Without it the heading is a title; with it, it is a
     statement about coverage. */
  var stampTxt=esc(d.stamp||"FAA Service Difficulty Reports");
  if(!d.stamp&&heroRange&&heroRange.from&&heroRange.to)
    stampTxt+=' \u00b7 '+esc(shortDate(heroRange.from)).toUpperCase()+
              ' TO '+esc(shortDate(heroRange.to)).toUpperCase();
  h+='<div class="ihead"><div class="stamp">'+stampTxt+'</div>';
  /* The reference puts a tablist beside the stamp. Without it a rail can only
     be reached by clicking the rail itself, which leaves no keyboard route at
     all and no announcement of which of the four is open. */
  h+='<div class="picker" role="tablist" aria-label="Which rail is open">'+
     [["when","WHEN","month by month"],["where","WHERE","on the aircraft"],
      ["whose","WHO","airline and tail"],["forced","WHAT IT FORCED","what the crew did"]]
     .map(function(r){var on=openKey===r[0];
       return '<button type="button" role="tab" data-pick="'+r[0]+'"'+
         ' aria-selected="'+(on?"true":"false")+'" tabindex="'+(on?"0":"-1")+'">'+
         '<span class="q">'+r[1]+'</span><span class="pn">'+r[2]+'</span></button>';}).join("")+
     '</div></div>';
  h+='<p class="stand">'+standingSentence(d)+'</p>';
  h+='<div class="aim" id="iAim" aria-live="polite"></div>';
  h+='<div class="rails">';
  h+=railWhen(d,  openKey==="when",  nar);
  h+=railWhere(d, openKey==="where", nar);
  h+=railWho(d,   openKey==="whose", nar);
  h+=railForced(d,openKey==="forced",nar);
  /* the margin belongs to the instrument, not to one rail: what a part month
     counts, and that these are reports filed rather than flights, is true
     whichever rail is open. Rendered inside WHEN it vanished the moment a
     reader opened the aircraft. */
  h+='</div>'+specimenHTML(d,phone)+whenMargin(d);
  host.innerHTML=h;
  heroAfter();
}
function drawPhone(d){ drawHero(d,true); }
function heroAfter(){

  var wtr=document.querySelector('.rail.open[data-rail=when] .track');
  if(wtr) wtr.scrollLeft=wtr.scrollWidth;   // over-set, browser clamps hard right: opens at the most recent
}
function skeletonHTML(){
  var G=[["when","WHEN"],["where","WHERE"],["whose","WHO"],["forced","FORCED"]];
  return '<div class="stamp">FAA Service Difficulty Reports</div><p class="stand">&nbsp;</p><div class="aim" id="iAim"></div>'
    +'<div class="rails">'+G.map(function(g){return '<div class="rail" data-rail="'+g[0]+'"><div class="gut rest"><b>'+g[1]+'</b></div></div>';}).join("")+'</div>';
