/* ---------------- WHEN ---------------- */
function partialMonth(m,d){
  var ms=(d&&d.months)||[]; if(!ms.length) return false;
  var p=params(), f=p.get("from"), t=p.get("to"), R=heroRange||{};
  if(m===ms[0].m && R.from && R.from.slice(8,10)!=="01") return true;
  if(m===ms[ms.length-1].m && R.to && +R.to.slice(8,10)!==lastDay(m)) return true;
  if(f && f.slice(0,7)===m && f.slice(8,10)!=="01") return true;
  if(t && t.slice(0,7)===m && +t.slice(8,10)!==lastDay(m)) return true;
  return false;
}
function settled(m,d){
  var cut=d&&d.lag&&d.lag.settled_before; if(!cut) return true;
  return (m+"-"+String(lastDay(m)).padStart(2,"0"))<=cut;
}
function coveredDays(m){
  var lo=heroRange.from, hi=heroRange.to, p=params();
  if(p.get("from")&&(!lo||p.get("from")>lo)) lo=p.get("from");
  if(p.get("to")&&(!hi||p.get("to")<hi)) hi=p.get("to");
  var s=1, e=lastDay(m);
  if(lo&&lo.slice(0,7)===m) s=+lo.slice(8,10);
  if(hi&&hi.slice(0,7)===m) e=+hi.slice(8,10);
  return {s:s,e:e,days:Math.max(0,e-s+1),inMonth:lastDay(m)};
}
function railWhen(d,open,nar){
  var ms=d.months||[]; if(!ms.length) return "";
  var H=open?84:14, cmax=1, smax=0, i, m;
  for(i=0;i<ms.length;i++){ if((ms[i].all||0)>cmax)cmax=ms[i].all; if((ms[i].n||0)>smax)smax=ms[i].n; }
  var wide=open&&ms.length>72;
  var s="";
  for(i=0;i<ms.length;i++){
    m=ms[i];
    var pm=partialMonth(m.m,d), un=!settled(m.m,d), part=pm||un;
    var ch=(m.all||0)/cmax*H, sh=nar?(m.n||0)/cmax*H:0;
    var suff=pm?", a part month":(un?", still filling up":"");
    s+='<span class="mo'+(part?" part":"")+'" data-aim="month|'+m.m+'" '
      +(open?'tabindex="0" role="button"':'tabindex="-1" role="presentation"')
      +' aria-label="'+esc(monthName(m.m))+', '+num(m.n)+' reports'+suff+'">'
      +'<i class="ghostb" style="height:'+ch.toFixed(1)+'px'
      +((!open&&!part)?';--sa:'+(0.3+0.7*((m.all||0)/cmax)).toFixed(3):"")+'"></i>'
      +(sh>0?'<i class="selb" style="height:'+sh.toFixed(1)+'px"></i>':"")
      +'</span>';
  }
  var body='<div class="track"'+(wide?' style="--mw:'+(ms.length*9)+'px"':"")+'><div class="months">'+mag(d,open,ms,cmax,smax)+s+'</div>'+axis(open,ms)+'</div>';
  if(open){
    body+='<div class="hint">'+(wide
      ? num(ms.length)+' months, so the strip scrolls sideways. It opens at the most recent.'
      : 'Drag across the months to take a period.')+'</div>'
      +'<div class="reading">'+whenReading(d)+'</div>';
  }
  // WHEN never passes `open` to gutter(): the compact form always, "month by month" never in the gutter. Kept.
  return '<div class="rail'+(open?" open":"")+'" data-rail="when">'
    +gutter("WHEN","month by month",esc(periodClause()||(num(ms.length)+" month"+(ms.length===1?"":"s"))))
    +body+'</div>';
}
function axis(open,ms){
  if(!open) return "";
  return '<div class="axis">'+ms.map(function(x){return '<span>'+(x.m.slice(5)==="01"?x.m.slice(0,4):"")+'</span>';}).join("")+'</div>';
}
function mag(d,open,ms,cmax,smax){
  if(!(open&&smax>0&&smax<cmax*0.25)) return "";
  var f=(cmax*0.62)/smax;
  var pts=ms.map(function(x,ix){
    return (((ix+0.5)/ms.length)*1000).toFixed(1)+","+(1000-(x.n/smax)*620).toFixed(1);
  }).join(" ");
  return '<div class="mag"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">'
    +'<polyline points="'+pts+'" fill="none" stroke="#c44b28" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>'
    +'<span class="magnote">selection &times;'+f.toFixed(1)+' to be visible</span></div>';
}
function periodClause(){
  var fEl=document.getElementById("from"), tEl=document.getElementById("to");
  var fv=(fEl&&fEl.value)||params().get("from")||"";
  var tv=(tEl&&tEl.value)||params().get("to")||"";
  if(!fv&&!tv) return "";
  var fd=fv.slice(8,10), fm=+fv.slice(5,7), fy=fv.slice(0,4);
  var td=tv.slice(8,10), tm=+tv.slice(5,7), ty=tv.slice(0,4);
  if(fv&&tv){
    if(fy===ty&&fm===tm){
      var ld=String(lastDay(fy+"-"+fv.slice(5,7))).padStart(2,"0");
      if(fd==="01"&&td===ld) return HERO_MONTHS[fm-1]+" "+fy;              // only a whole month may be called one
      if(fd==="01") return (+fd)+" to "+(+td)+" "+HERO_MONTHS[fm-1]+" "+fy;
    }
    return (+fd)+" "+HERO_MONTHS_S[fm-1]+" "+fy+" to "+(+td)+" "+HERO_MONTHS_S[tm-1]+" "+ty;
  }
  if(fv) return "from "+(+fd)+" "+HERO_MONTHS_S[fm-1]+" "+fy;
  return "up to "+(+td)+" "+HERO_MONTHS_S[tm-1]+" "+ty;
}
function whenReading(d){
  var ms=d.months||[]; if(ms.length<2) return "";
  var allm=ms.filter(function(m){return !partialMonth(m.m,d);});
  var full=allm.filter(function(m){return settled(m.m,d);});
  var young=allm.length-full.length;
  if(full.length<2) return "";
  var hi=full[0], lo=full[0];
  full.forEach(function(m){
    if(m.n>hi.n||(m.n===hi.n&&m.m<hi.m)) hi=m;
    if(m.n<lo.n||(m.n===lo.n&&m.m<lo.m)) lo=m;
  });
  var out='Between '+num(lo.n)+' and '+num(hi.n)+' reports in a settled month, busiest in '+monthName(hi.m)+', quietest in '+monthName(lo.m)+'.';
  if(full.length>=24){
    var last=full.slice(-12), prev=full.slice(-24,-12);
    var a=Math.round(last.reduce(function(s,m){return s+m.n;},0)/12);
    var bb=Math.round(prev.reduce(function(s,m){return s+m.n;},0)/12);
    if(bb>0){
      var diff=Math.round(Math.abs(a-bb)/bb*100);   // absolute; direction is never stated
      out+=' The last twelve settled months average '+num(a)+' a month against '+num(bb)+' for the twelve before, a difference of '+diff+'%.';
    }
  }
  if(young>0){
    var lag=(d.lag&&d.lag.p95_days)||0, one=young===1;
    out+=' The '+spell(young)+' most recent month'+(one?"":"s")+' '+(one?"is":"are")+' left out of those figures: reports still arrive up to '
        +num(lag)+' days after the event, so '+(one?"it holds":"they hold")+' only part of what '+(one?"it":"they")+' will hold. '
        +'The dip at the right of the chart is the post arriving late, not fewer faults.';
  }
  return out;
}
function whenMargin(d){
  var notes=[], ms=d.months||[];
  ms.forEach(function(m){
    if(!partialMonth(m.m,d)) return;
    var c=coveredDays(m.m), mm=+m.m.slice(5,7), yy=m.m.slice(0,4);
    if(c.days>=c.inMonth) return;   /* a whole month is not a part month, whatever flagged it */
    notes.push('<span class="mr">'+HERO_MONTHS[mm-1]+' '+yy+' covers '+(c.s===1?"1":c.s)+' to '+c.e+' '+HERO_MONTHS[mm-1]
      +', so its bar counts '+num(c.days)+' days against '+num(c.inMonth)+' in a whole one</span>');
  });
  /* the airframe list is the 900 most-reported of 54,634, and that is true
     whichever rail is showing. Computed from the response rather than from the
     WHO renderer, which only runs when WHO is open. */
  var sw=(d&&d.swarm)||[], swT=(d&&(d.swarm_total!=null?d.swarm_total:d.aircraft))||0;
  if(swT>sw.length&&sw.length)
    notes.push('<span class="mr">the tail list shows the '+num(sw.length)+
      ' most-reported aircraft out of '+num(swT)+'; the airline list counts every report</span>');
  notes.push('<span>counts are of reports filed, not of flights</span>');
  return '<div class="margin">'+notes.join("<br>")+'</div>';
}

/* ---------------- WHERE (anatomy) ---------------- */
function zoneRows(d){
  var raw=(d&&(d.zones||d.anatomy||d.regions))||[];
  return raw.map(function(r){
    var id=r.z||r.zone||r.id||r.k||"";
    return {id:id,label:r.label||id||"?",n:r.n||0};
  }).filter(function(r){return r.id;}).sort(function(a,b){return b.n-a.n;});
}
function railWhere(d,open,nar){
  var rows=zoneRows(d), p=params(), tot=d.total||0;
  var sel=p.get("zone")||p.get("region")||"";
  var hit=rows.find(function(x){return x.id===sel;});
  var g=gutter("WHERE","on the aircraft", sel?esc((hit||{}).label||sel):"all zones", open);
  var body;
  if(open){
    var mx=1; rows.forEach(function(r){ if(r.n>mx)mx=r.n; });
    var list=rows.slice(0,20).map(function(r){
      return '<div class="orow" data-aim="zone|'+esc(r.id)+'" data-take="zone|'+esc(r.id)+'" tabindex="0" role="button">'
        +'<span class="on">'+esc(r.label)+'</span>'
        +'<span class="ob"><i style="width:'+(r.n/mx*100).toFixed(1)+'%"></i></span>'
        +'<b>'+num(r.n)+'</b></div>';
    }).join("");
    body='<div class="track"><div class="col"><div class="ch">Zones</div>'+list+'</div></div>'
      +'<div class="hint">Click a zone of the aircraft to narrow to it.</div>'
      +'<div class="reading">'+whereReading(d)+'</div>'
      +'<div class="margin"><span>counts are of reports filed, not of flights</span></div>';
  }else{
    body='<div class="track"><div class="strip">'+rows.slice(0,12).map(function(r){
      return '<span data-op="'+esc(r.id)+'" style="flex:'+Math.max(1,r.n)+'" title="'+esc(r.label)+': '+num(r.n)+'"'+(sel===r.id?' class="sel"':"")+'></span>';
    }).join("")+'</div></div>';
  }
  return '<div class="rail'+(open?" open":"")+'" data-rail="where">'+g+body+'</div>';
}
function whereReading(d){
  var tot=d.total||0; if(!tot) return "";
  var rows=zoneRows(d), p=params();
  var sel=p.get("zone")||p.get("region");
  if(sel){
    var r=rows.find(function(x){return x.id===sel;});
    if(r) return num(r.n)+' reports put the trouble in '+esc(r.label.toLowerCase())+'. The other '+num(tot-r.n)+' happened elsewhere on the airframe, or name no zone at all.';
  }
  if(!rows.length) return num(tot)+' reports stand open across every zone of the aircraft.';
  var top=rows[0], named=rows.reduce(function(s,r){return s+r.n;},0);
  var out=num(tot)+' reports are counted by zone of the aircraft. '+esc(top.label)+' leads with '+num(top.n)+', '+pct(top.n,tot)+'% of the selection';
  if(named<tot) out+='; '+num(tot-named)+' name no zone';
  return out+'.';
}

/* ---------------- WHO (swarm) ---------------- */
function railWho(d,open,nar){
  var ops=d.operator_rows||[], nOps=d.operators||0;
  var swarm=d.swarm||[], swT=d.swarm_total||0;
  var g=gutter("WHO","airline and tail", num(swT||d.aircraft||0)+" aircraft", open);
  var body;
  if(!open){
    var sel=params().get("operator")||"";
    body='<div class="track"><div class="strip">'+ops.slice(0,8).map(function(r){
      return '<span data-op="'+esc(r.o)+'" style="flex:'+Math.max(1,r.n)+'" title="'+esc(opName(r.o))+': '+num(r.n)+'"'+(sel===r.o?' class="sel"':"")+'></span>';
    }).join("")+'</div></div>';
  }else{
    var mxO=1; ops.forEach(function(r){ if(r.n>mxO)mxO=r.n; });
    var orows=ops.map(function(r){
      return '<div class="orow" data-aim="op|'+esc(r.o)+'" data-take="operator|'+esc(r.o)+'" tabindex="0" role="button">'
        +'<span class="on">'+esc(opName(r.o))+'</span>'
        +'<span class="ob"><i style="width:'+(r.n/mxO*100).toFixed(1)+'%"></i></span>'
        +'<b>'+num(r.n)+'</b></div>';
    }).join("");
    if(nOps-ops.length>0) orows+='<div class="orow more" data-aim="more-ops"><span class="on ash">'+num(nOps-ops.length)+' more operators</span></div>';
    var tails=swarm.slice(0,8), mxA=1;
    tails.forEach(function(r){ if(r.n>mxA)mxA=r.n; });
    var trows=tails.map(function(r){
      return '<div class="orow" data-aim="tail|'+esc(r.t)+'" data-take="tail|'+esc(r.t)+'" tabindex="0" role="button">'
        +'<span class="on mono">N'+esc(r.t)+'</span>'
        +'<span class="ob"><i style="width:'+(r.n/mxA*100).toFixed(1)+'%"></i></span>'
        +'<b>'+num(r.n)+'</b></div>';
    }).join("");
    if(swT>swarm.length) trows+='<div class="orow more" data-aim="more-tails"><span class="on ash">'+num(swT-swarm.length)+' more airframes, not ranked here</span></div>';
    body='<div class="track two">'
      +'<div class="col"><div class="ch">Operators</div>'+orows+'</div>'
      +'<div class="col"><div class="ch">Airframes</div>'+trows+'</div></div>'
      +'<div class="hint">Click an airline or an airframe to follow it.</div>'
      +'<div class="reading">'+whoReading(d)+'</div>'
      ;
    /* the cap is true whether or not this rail is open, so it belongs to the
       instrument's margin. Kept here it appeared only while WHO was showing,
       and a reader on the aircraft never learned that the airframe list is the
       900 most-reported rather than all of them. */
    ;
  }
  return '<div class="rail'+(open?" open":"")+'" data-rail="whose">'+g+body+'</div>';
}
function whoReading(d){
  var tot=d.total||0; if(!tot) return "";
  var ops=d.operator_rows||[], nOps=d.operators||0, out="";
  if(ops.length&&nOps>ops.length){
    var top=ops.reduce(function(s,r){return s+r.n;},0);
    out=spell(ops.length)+' operators file '+pct(top,tot)+'% of what is here; the other '+num(nOps-ops.length)+' share the rest.';
    out=out.charAt(0).toUpperCase()+out.slice(1);
  }else{
    out=num(nOps)+' '+(nOps===1?"operator files":"operators file")+' everything here.';
  }
  out+=' '+num(d.aircraft||0)+' aircraft appear in all.';
  var sw=(d.swarm||[])[0];
  if(sw&&sw.n>1) out+=' One of them, N'+esc(sw.t)+', is written up '+num(sw.n)+' times.';
  return out;
}

/* ---------------- FORCED (ledger) ---------------- */
function railForced(d,open,nar){
  var tot=d.total||0, cr=d.crew_reports||0;
  var sh=tot?(cr/tot*100):0;   // crew_reports, never the sum of the per-code counts
  var g=gutter("FORCED","what the crew did", num(cr)+" of "+num(tot), open);
  var body;
  if(!open){
    body='<div class="track"><div class="restbar"><i style="width:'+sh.toFixed(2)+'%"></i></div></div>';
  }else{
    var allc=(d.crew||[]).filter(function(x){return ["K","0","O"].indexOf(x.code)<0;});
    var rows=allc.slice(0,8), mx=1;   // cap is 8; up to two non-zero actions are silently omitted, no "more" affordance
    rows.forEach(function(r){ if(r.n>mx)mx=r.n; });
    body='<div class="track">'
      +'<div class="fblock" data-aim="crewall"><i style="width:'+sh.toFixed(2)+'%"></i>'
      +'<span class="flab">'+num(cr)+' of '+num(tot)+' forced a crew action</span></div>'
      +'<div class="flist">'+rows.map(function(r){
          return '<div class="orow wide" data-aim="crew|'+esc(r.code)+'" data-take="crew|'+esc(r.code)+'" tabindex="0" role="button">'
            +'<span class="on">'+esc(r.label)+'</span>'
            +'<span class="ob"><i style="width:'+(r.n/mx*100).toFixed(1)+'%"></i></span>'
            +'<b>'+num(r.n)+'</b></div>';
        }).join("")+'</div>'
      +'<div class="fnote">A report can carry four of these, so they add to more than '+num(cr)+'.</div>'
      +'</div>'
      +'<div class="hint">Click what the crew had to do.</div>'
      +'<div class="reading">'+forcedReading(d)+'</div>';
  }
  return '<div class="rail'+(open?" open":"")+'" data-rail="forced">'+g+body+'</div>';
}
function forcedReading(d){
  var tot=d.total||0; if(!tot) return "";
  var cr=d.crew_reports||0;
  if(!cr) return 'No report in this selection records an action the crew had to take. Everything here was found on the ground.';
  var allc=(d.crew||[]).filter(function(x){return ["K","0","O"].indexOf(x.code)<0;});
  var top=allc[0], r=top?rate(top.n,(d.span&&d.span.days)||0):"";
  var out=num(cr)+' reports, '+pct(cr,tot)+'% of this selection, record something the crew had to do rather than something found on the ground.';
  if(top) out+=' The commonest is '+esc(top.label.toLowerCase())+', '+num(top.n)+' times'+(r?", "+esc(r)+".":".");
  return out;
}
function rate(n,days){
  if(!n||!days||n<30||days<60) return "";
  var per=days/n;
  if(per>=1.5) return 'about one every '+Math.round(per)+' days';
  return 'about '+(n/days).toFixed(1)+' a day';
}

/* ---------------- specimen ---------------- */
function specLine(s){
  var dead=["","Other","Not reported","Unknown","None"];
  var ok=function(v){ return v&&!dead.includes(v); };
  var norm=function(x){ return String(x||"").toLowerCase().replace(/[^a-z]/g,""); };
  var parts=[];
  if(ok(s.aircraft)) parts.push(esc(s.aircraft));
  if(ok(s.system)) parts.push(esc(s.system));
  if(ok(s.part)){
    var a=norm(s.system), b=norm(s.part);
    if(!a||!b||(!a.includes(b)&&!b.includes(a))) parts.push(esc(s.part));   // dropped only when it repeats the system
  }
  if(ok(s.condition)) parts.push(esc(s.condition));
  if(ok(s.found)) parts.push(esc(s.found));
  if(ok(s.stage)) parts.push(esc(s.stage));
  if(s.date) parts.push(esc(prettyDate(s.date)));
  return parts.join(" &middot; ");
}
function specimenHTML(d,phone){
  var s=d.specimen; if(!s) return "";
  var line=(d.lines||[])[0]||"", ctrl=s.control||"", open=!!ctrl, dec=specLine(s);
  return '<div class="specimen'+(open?" opens":"")+'"'
    +(open?' role="button" tabindex="0" data-case="'+esc(ctrl)+'" aria-label="Open the full report '+esc(ctrl)+'"':"")+'>'
    +'<div class="sh">One report from this selection. First the FAA&rsquo;s own filing of it, then the mechanic&rsquo;s words as written.'
    +(open?' <span class="opencue">'+(phone?"Tap to open it &rarr;":"Click to open the full report &rarr;")+'</span>':"")+'</div>'
    +(dec?'<div class="spec-decoded">'+dec+'</div>':"")
    +(line?'<div class="sl">'+sj(line)+'</div>':"")
    +'</div>';
}

/* ---------------- standing sentence ---------------- */
function selectionDesc(d){
  var p=params(), out=[];
  var z=p.get("zone")||p.get("region");
  if(z){ var r=zoneRows(d).find(function(x){return x.id===z;}); out.push(r?r.label:z); }
  var op=p.get("operator"); if(op) out.push(opName(op));
  var tl=p.get("tail"); if(tl) out.push("N"+tl);
  var cr=p.get("crew"); if(cr){ var c=(d.crew||[]).find(function(x){return x.code===cr;}); out.push(c?c.label.toLowerCase():cr); }
  var per=periodClause(); if(per) out.push(per);
  return out.join(", ");
}
function standingSentence(d){
  if(!d) return "";
  var stale=HERO_FOR!==filterQS();          // never print a figure computed for a different selection
  var tot=d.total||0, desc=selectionDesc(d), c1=stale?"…":num(tot);
  if(desc){
    var grand=d.corpus||d.grand||d.all_total||d.every||0, rest=grand?grand-tot:0;
    var s=c1+' reports, '+esc(desc)+'.';
    if(rest>0) s+=' '+(stale?"…":num(rest))+' set aside.';
    return s;
  }
  var pub=d.published||d.asof||heroRange.to;
  return c1+' reports'+(pub?', everything the FAA has published to '+esc(prettyDate(pub)):"")+'.';
}

/* ---------------- month interactions ---------------- */
function monthAt(ev,box){
  var ms=(heroData&&heroData.months)||[], n=ms.length;
  if(!n||!box) return null;
  var r=box.getBoundingClientRect();
  var i=Math.floor((ev.clientX-r.left)/(r.width||1)*n);   // uniform division of the whole box, scroll-safe
  if(i<0)i=0; if(i>n-1)i=n-1;
  return ms[i].m;
}
function whenMonthsBox(){ var rail=document.querySelector('.rail.open[data-rail=when]'); return rail?rail.querySelector(".months"):null; }
function moList(){ return Array.prototype.slice.call(document.querySelectorAll('.rail.open[data-rail=when] .mo')); }
function paintBracket(a,b){
  if(!a||!b) return;
  var lo=a<b?a:b, hi=a>b?a:b, n=0, map={};
  ((heroData&&heroData.months)||[]).forEach(function(m){ map[m.m]=m.n||0; });
  document.querySelectorAll('.rail[data-rail=when] .mo').forEach(function(el){
    var k=(el.getAttribute("data-aim")||"").slice(6);
    var inb=!!k&&k>=lo&&k<=hi;
    el.classList.toggle("inband",inb);
    if(inb) n+=map[k]||0;
  });
  aim(monthName(lo)+' to '+monthName(hi)+' &middot; '+num(n)+' reports &middot; release to take it');
}
function monthAim(k){
  var m=((heroData&&heroData.months)||[]).find(function(x){return x.m===k;});
  return monthName(k)+' &middot; '+num(m?m.n:0)+' reports &middot; click to narrow to this month';
}
function heroMonth(el){ var k=(el.getAttribute("data-aim")||"").slice(6); if(k) takePeriod(k,k); }

var lastPeriodKey="", lastPeriodAt=0;
function takePeriod(a,b){
  if(!a||!b) return;
  var key=a+"|"+b, now=Date.now();
  if(key===lastPeriodKey&&now-lastPeriodAt<400) return;
  lastPeriodKey=key; lastPeriodAt=now;
  var lo=a<b?a:b, hi=a>b?a:b;
  var from=lo+"-01", to=hi+"-"+String(lastDay(hi)).padStart(2,"0");
  var p=params(); p.set("from",from); p.set("to",to);
  history.pushState(null,"",location.pathname+"?"+p.toString());
  lastFilterQS=filterQS();
  var f=document.getElementById("from"), t=document.getElementById("to");
  if(f) f.value=from;  if(t) t.value=to;
  showPSearch();
  syncControls(); runSearch(0);
  if(typeof showChange==="function") showChange();
  aimHold('narrowed to '+monthName(lo)+(lo===hi?"":" to "+monthName(hi))
    +'. <button class="undoit" onclick="history.back();unaim()">undo</button>');
}

/* ---------------- filters ---------------- */
var lastTakeKey="", lastTakeAt=0;
function runTake(elOrDt){
  var dt=typeof elOrDt==="string"?elOrDt:((elOrDt.getAttribute&&elOrDt.getAttribute("data-take"))||"");
  var i=dt.indexOf("|"); if(i<0) return;
  var key=dt, now=Date.now();
  if(key===lastTakeKey&&now-lastTakeAt<400) return;
  lastTakeKey=key; lastTakeAt=now;
  var k=dt.slice(0,i), v=dt.slice(i+1);
  if(k==="operator") takeFilter("operator",v,opName(v));
  else if(k==="tail") takeFilter("tail",v,"N"+v);
  else if(k==="crew"){ var c=((heroData&&heroData.crew)||[]).find(function(x){return x.code===v;}); takeFilter("crew",v,c?c.label:v); }
  else if(k==="zone"){ var z=zoneRows(heroData||{}).find(function(x){return x.id===v;}); takeFilter("zone",v,z?z.label:v); }
}
function takeFor(dt){ runTake(dt); }
function takeFilter(key,val,label){
  var p=params(); p.set(key,val);
  history.pushState(null,"",location.pathname+"?"+p.toString());
  lastFilterQS=filterQS();
  syncControls(); showPSearch(); runSearch(0);
  if(typeof showChange==="function") showChange();
  aimHold('narrowed to '+esc(label)+'. <button class="undoit" onclick="history.back();unaim()">undo</button>');
}
function showPSearch(){
  var ps=document.getElementById("p-search");
  if(ps){ ps.hidden=false; if(ps.classList) ps.classList.remove("hide","hidden"); }
}
function syncControls(){
  var p=params();
  var f=document.getElementById("from"), t=document.getElementById("to");
  if(f&&p.get("from")) f.value=p.get("from");
  if(t&&p.get("to")) t.value=p.get("to");
  document.querySelectorAll(".orow[data-take]").forEach(function(el){
    var dt=el.getAttribute("data-take"), i=dt.indexOf("|");
    el.classList.toggle("taken", i>0&&(p.get(dt.slice(0,i))||"")===dt.slice(i+1));
  });
  document.querySelectorAll(".strip span[data-op]").forEach(function(el){
    el.classList.toggle("sel",(p.get("operator")||"")===el.getAttribute("data-op"));
  });
}
function takeReading(kind,v){
  if(kind!=="period") return;
  v=String(v||"").trim();
  var lo,hi,label;
  if(/^\d{4}$/.test(v)){ lo=v+"-01-01"; hi=v+"-12-31"; label=v; }
  else if(/^\d{4}-\d{2}$/.test(v)){ lo=v+"-01"; hi=v+"-"+String(lastDay(v)).padStart(2,"0"); label=monthName(v); }
  else return;
  var f=heroRange.from, t=heroRange.to, olo=lo, ohi=hi;
  if(f&&t){
    var clo=lo<f?f:lo, chi=hi>t?t:hi;
    if(clo<=chi){ lo=clo; hi=chi; }   // clamp only where the period and the file overlap
    else{
      aimHold(esc(label)+' is a valid month or year, but this file holds no report for it. It runs from '
        +esc(prettyDate(f))+' to '+esc(prettyDate(t))+'.');
      return;                          // wholly outside: left as asked, returns nothing, says so
    }
  }
  var lab=(lo!==olo||hi!==ohi)?(prettyDate(lo)+' to '+prettyDate(hi)):label;
  var p=params(); p.set("from",lo); p.set("to",hi);
  history.pushState(null,"",location.pathname+"?"+p.toString());
  lastFilterQS=filterQS();
  var fEl=document.getElementById("from"), tEl=document.getElementById("to");
  if(fEl) fEl.value=lo;  if(tEl) tEl.value=hi;
  showPSearch();
  syncControls(); runSearch(0);
  if(typeof showChange==="function") showChange();
  aimHold('narrowed to '+esc(lab)+'. <button class="undoit" onclick="history.back();unaim()">undo</button>');
}

/* ---------------- table cross-highlight ---------------- */
function paintSpines(){
  if(!heroData||!heroData.months) return;
  var map={}; heroData.months.forEach(function(m){ map[m.m]=m.n||0; });
  document.querySelectorAll(".spinen").forEach(function(el){
    var tr=el.closest&&el.closest("tr[data-month]");
    var k=el.getAttribute("data-month")||(tr?tr.getAttribute("data-month"):null);
    if(k&&map[k]!=null) el.textContent=num(map[k])+' in this selection';
  });
}
function aimFor(el){
  var a=el.getAttribute("data-aim")||""; if(!a) return;
  if(a.indexOf("month|")===0){ aim(monthAim(a.slice(6))); return; }
  if(a==="more-ops"){ aim('not ranked here; use the operator control below to reach any of the '+num((heroData&&heroData.operators)||0)); return; }
  if(a==="more-tails"){ aim("not ranked here; type a tail number in the controls below"); return; }
  if(a==="crewall"){ aim(num((heroData&&heroData.crew_reports)||0)+' of '+num((heroData&&heroData.total)||0)+' reports forced the crew to act'); return; }
  var bar=a.indexOf("|"), k=a.slice(0,bar), v=a.slice(bar+1);
  if(k==="op") aim(esc(opName(v))+' &middot; click to follow this operator');
  else if(k==="tail") aim('N'+esc(v)+' &middot; click to follow this one airframe');
  else if(k==="crew"){ var c=((heroData&&heroData.crew)||[]).find(function(x){return x.code===v;}); aim(esc(c?c.label:v)+' &middot; '+num(c?c.n:0)+' reports &middot; click to narrow'); }
  else if(k==="zone"){ var z=zoneRows(heroData||{}).find(function(x){return x.id===v;}); aim(esc(z?z.label:v)+' &middot; '+num(z?z.n:0)+' reports &middot; click to narrow'); }
}

/* ---------------- events, bound once ---------------- */
if(!window.__HERO2_BOUND__){
  window.__HERO2_BOUND__=true;

  document.addEventListener("pointerdown",function(e){
    var rail=e.target.closest?e.target.closest('.rail.open[data-rail=when]'):null;
    if(!rail) return;
    var box=rail.querySelector(".months"); if(!box) return;
    e.preventDefault();                    // text selection and browser panning suppressed; the drag is unambiguous
    dragFrom=monthAt(e,box);
    if(dragFrom==null) return;
    paintBracket(dragFrom,dragFrom);
    var track=rail.querySelector(".track");
    if(track&&track.setPointerCapture){ try{track.setPointerCapture(e.pointerId);}catch(_){}}
  });
  document.addEventListener("pointermove",function(e){
    if(dragFrom==null) return;
    var box=whenMonthsBox(); if(!box){ dragFrom=null; return; }
    paintBracket(dragFrom,monthAt(e,box));
  });
  document.addEventListener("pointerup",function(e){
    if(dragFrom==null) return;
    var a=dragFrom; dragFrom=null;
    var box=whenMonthsBox();
    var b=box?monthAt(e,box):null;
    takePeriod(a,b||a);                    // a plain click is a zero-length drag: one month
  });
  document.addEventListener("pointercancel",function(){
    dragFrom=null;
    document.querySelectorAll('.mo.inband').forEach(function(el){ el.classList.remove("inband"); });
  });

  document.addEventListener("mouseover",function(e){
    var t=e.target, tr=t.closest?t.closest("tr[data-month]"):null;
    if(tr){
      var k=tr.getAttribute("data-month");
      var mo=document.querySelector('.mo[data-aim="month|'+k+'"]');
      if(mo) mo.classList.add("lit");
      tr.classList.add("lit");
    }
    var a=t.closest?t.closest("[data-aim]"):null;
    if(a) aimFor(a);
  });
  document.addEventListener("mouseout",function(e){
    var t=e.target, tr=t.closest?t.closest("tr[data-month]"):null;
    if(tr){
      var k=tr.getAttribute("data-month");
      var mo=document.querySelector('.mo[data-aim="month|'+k+'"]');
      if(mo) mo.classList.remove("lit");
      tr.classList.remove("lit");
    }
    var a=t.closest?t.closest("[data-aim]"):null;
    if(a) aim("");
  });

  document.addEventListener("focusin",function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains("mo")){
      var k=(t.getAttribute("data-aim")||"").slice(6);
      if(k) aim(monthAim(k));
      return;
    }
    var row=t.closest?t.closest("[data-aim]"):null;
    if(row) aimFor(row);
  });

  document.addEventListener("click",function(e){
    var t=e.target, take=t.closest?t.closest("[data-take]"):null;
    if(take){ runTake(take); return; }
    var closed=t.closest?t.closest(".rail:not(.open)[data-rail]"):null;
    if(closed){ setHero(closed.getAttribute("data-rail")); return; }   // a shut rail opens when clicked
    var sp=t.closest?t.closest("[data-case]"):null;
    if(sp&&typeof openCase==="function") openCase(sp.getAttribute("data-case"));
  });

  document.addEventListener("keydown",function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains("mo")){
      var ms=(heroData&&heroData.months)||[], els=moList(), idx=els.indexOf(t);
      var key=function(i){ return ms[i]?ms[i].m:null; };
      if(e.key==="ArrowRight"||e.key==="ArrowLeft"||e.key==="Home"||e.key==="End"){
        e.preventDefault();
        var ni=idx;
        if(e.key==="ArrowRight") ni=Math.min(ms.length-1,idx+1);
        else if(e.key==="ArrowLeft") ni=Math.max(0,idx-1);
        else if(e.key==="Home") ni=0;
        else ni=ms.length-1;
        if(!e.shiftKey) kbAnchor=null;
        else if(kbAnchor==null) kbAnchor=idx;
        if(els[ni]) els[ni].focus();       // focus FIRST, then repaint, or focusin overwrites the bracket
        var ai=kbAnchor==null?ni:kbAnchor;
        if(key(ni)&&key(ai)) paintBracket(key(ai),key(ni));
        return;
      }
      if(e.key==="Enter"||e.key===" "||e.key==="Spacebar"){
        e.preventDefault();
        if(kbAnchor!=null&&ms[kbAnchor]) takePeriod(key(kbAnchor),key(idx));
        else heroMonth(t);
      }
      return;
    }
    if(e.key==="Enter"||e.key===" "){
      var take=t.closest?t.closest("[data-take]"):null;
      if(take&&take.getAttribute("role")==="button"){ e.preventDefault(); runTake(take); return; }
      var sp=t.closest?t.closest("[data-case]"):null;
      if(sp){ e.preventDefault(); if(typeof openCase==="function") openCase(sp.getAttribute("data-case")); }
    }
  });

  window.addEventListener("popstate",function(){
    syncControls(); unaim();
    if(heroData) drawHero(heroData);
    var q=filterQS();
    if(lastFilterQS===null) lastFilterQS=q;
    if(q!==lastFilterQS){ lastFilterQS=q; runSearch(0); }
  });

  var rT=null;
  window.addEventListener("resize",function(){
    clearTimeout(rT);
    rT=setTimeout(function(){ if(heroData) drawHero(heroData); },180);
  });
}

/* ---- WHERE: keep the aircraft ----------------------------------------
   03-rails rebuilt this rail as a ladder. It had no specification to work
   from (the brief carried WHEN, WHO and FORCED, because WHERE was already
   done) and it guessed the field name as z|zone|id|k where the API says
   code, so every row filtered out and the column came up empty.
   The drawing from 02-where is kept, fed from this block's heroData. */
railWhere = function(d, open, nar){
  HERO = {raw:d};

/* ---- guarded wrappers over the page's own helpers ---- */
var VH = (typeof esc === 'function') ? esc : function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var VN = (typeof num === 'function') ? num : function(x){ return Number(x||0).toLocaleString('en-US'); };
function vEl(id){ try{ if(typeof el==='function') return el(id); }catch(_){} return document.getElementById(id); }
function vget(url){ return fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
function vaim(t){ try{ if(typeof aim==='function') aim(t); }catch(_){} }
function vcode(grp,v){ if(v==null||v==='') return null; try{ if(typeof code==='function'){ var s=code(grp,v); if(s) return s; } }catch(_){} return null; }
function pdate(s){ if(!s) return ''; try{ if(typeof prettyDate==='function') return prettyDate(s); }catch(_){} return String(s); }
function pstr(){ try{ return params().toString(); }catch(_){ return new URLSearchParams(location.search).toString(); } }
function totalN(){ try{ if(typeof TOTAL==='number'&&TOTAL) return TOTAL; }catch(_){} try{ if(heroData&&heroData.total) return heroData.total; }catch(_){} return 0; }
function selN(){ try{ if(typeof LAST_TOTAL!=='undefined'&&LAST_TOTAL!=null) return LAST_TOTAL; }catch(_){} try{ if(heroData&&heroData.total!=null) return heroData.total; }catch(_){} return 0; }
function ataLab(c){ try{ if(typeof ATA!=='undefined'&&ATA&&ATA[c]) return ATA[c]; }catch(_){} return c?('ATA chapter '+c):''; }

/* The reader's selection, in words — filterWords() when the search half provides it,
   a plain fallback from params() when it does not. '' means nothing is selected.   */
function selWords(){
  try{ if(typeof filterWords==='function'){ var s=filterWords(); if(s) return s; } }catch(_){}
  var bits=[];
  try{ var p=params(); function g(k){ var v=p.get(k); return v?v:''; }
    if(g('q')) bits.push('where a mechanic wrote "'+g('q')+'"');
    if(g('jasc')) bits.push('system '+g('jasc'));
    if(g('ata')) bits.push('system chapter '+g('ata'));
    if(g('part')) bits.push('part '+g('part'));
    if(g('condition')) bits.push('part condition '+g('condition'));
    if(g('zone')) bits.push(g('zone'));
    if(g('operator')) bits.push('airline '+g('operator'));
    if(g('make')) bits.push('manufacturer '+g('make'));
    if(g('model')) bits.push('model '+g('model'));
    if(g('tail')) bits.push('tail N'+g('tail'));
    if(g('crew')) bits.push('crew action '+g('crew'));
    if(g('nature')) bits.push('finding '+g('nature'));
    if(g('discovered')) bits.push('found by '+g('discovered'));
    if(g('stage')) bits.push('stage '+g('stage'));
    if(g('corrosion')) bits.push('corrosion level '+g('corrosion'));
    if(g('minhours')) bits.push(VN(g('minhours'))+' hours or more on the airframe');
    if(g('cracked')) bits.push('with cracking recorded');
    if(g('from')||g('to')) bits.push('from '+(pdate(g('from'))||'…')+' to '+(pdate(g('to'))||'…'));
  }catch(_){}
  return bits.join(', ');
}

/* ---- shape-agnostic renderers (swap rL/rN/firstArr if the server's field names differ) ---- */
function objRows(rows){ return (rows||[]).map(function(r){ return typeof r==='string'?{label:r}:r; }); }
function firstArr(o){
  if(Array.isArray(o)) return o;
  if(!o||typeof o!=='object') return [];
  var names=['rows','items','results','data','list','leads','spikes','buckets','values','groups','clusters','phrases','offenders','months'];
  for(var i=0;i<names.length;i++) if(Array.isArray(o[names[i]])) return o[names[i]];
  for(var k in o){ var v=o[k]; if(Array.isArray(v)&&v.length&&(typeof v[0]==='object'||typeof v[0]==='string')) return v; }
  return [];
}
function rL(r){ return r.label!=null?r.label : r.name!=null?r.name : r.term!=null?r.term : r.title!=null?r.title : r.bucket!=null?r.bucket : r.month!=null?r.month : r.phrase!=null?r.phrase : r.key!=null?r.key : (r.code!=null?r.code:''); }
function rN(r){ var v=r.n!=null?r.n : r.count!=null?r.count : r.total!=null?r.total : r.reports!=null?r.reports : 0; return Number(v)||0; }
function rC(r){ return r.code!=null?r.code : (r.value!=null?r.value : rL(r)); }
function sumN(rows){ var t=0; (rows||[]).forEach(function(r){ t+=rN(r); }); return t; }
function pct_05(rows,n){ var m=0; (rows||[]).forEach(function(r){ m=Math.max(m,rN(r)); }); return m>0?Math.max(1,Math.round(100*n/m)):0; }
function prettyKey(k){ var s=String(k).replace(/_/g,' ').trim(); if(/^n$/i.test(s)) s='reports'; return s.charAt(0).toUpperCase()+s.slice(1); }
function monName(mo){ var M=['January','February','March','April','May','June','July','August','September','October','November','December']; return (M[(+mo.slice(5,7))-1]||'')+' '+mo.slice(0,4); }
function lastDay_05(mo){ return String(new Date(+mo.slice(0,4), +mo.slice(5,7), 0).getDate()); }
function optsHTML(pairs){ return pairs.map(function(p){ return '<option value="'+VH(p[0])+'">'+VH(p[1])+'</option>'; }).join(''); }
function statCard(n,lab,k,v){
  var open=(k?'<button type="button" class="stat" data-setk="'+VH(k)+'" data-setv="'+VH(String(v))+'">':'<span class="stat">');
  return open+'<b>'+(typeof n==='number'?VN(n):VH(n))+'</b><span>'+VH(lab)+'</span>'+(k?'</button>':'</span>');
}
function scalStats(o,lim){
  lim=lim||8; var out=[],i=0;
  for(var k in (o||{})){ var v=o[k], ok=false;
    if(typeof v==='number') ok=true;
    else if(typeof v==='string'){ if(/^\d{4}-\d{2}/.test(v)) ok=true; else if(v!==''&&/\d/.test(v)&&!isNaN(Number(v.replace(/,/g,'')))) ok=true; }
    if(!ok) continue;
    if(i++>=lim) break;
    var shown=(typeof v==='string'&&/^\d{4}-\d{2}/.test(v))?VH(pdate(v)):(typeof v==='number'?VN(v):VN(Number(v.replace? v.replace(/,/g,''):v)));
    out.push('<span class="stat"><b>'+shown+'</b><span>'+VH(prettyKey(k))+'</span></span>');
  }
  return out.join('');
}
function barList(rows,map,opts){
  opts=opts||{};
  var rs=objRows(rows||[]).filter(function(r){ return r&&typeof r==='object'; });
  if(!rs.length) return '<p class="pnote">Nothing listable came back for this.</p>';
  var max=0,tot=0; rs.forEach(function(r){ max=Math.max(max,rN(r)); tot+=rN(r); });
  var lim=opts.limit||14;
  var out=rs.slice(0,lim).map(function(r){
    var n=rN(r), lab=String(rL(r)!=null?rL(r):(rC(r)||'')), v=null;
    if(map) v=map.v?map.v(r):rC(r);
    var clicky=!!(map&&v!=null&&v!==''&&(r.code!=null||map.guess));
    var w=max>0?Math.max(1,Math.round(100*n/max)):0;
    return (clicky?'<button type="button" class="brow" data-setk="'+VH(map.k)+'" data-setv="'+VH(String(v))+'">':'<div class="brow plain">')+
      '<span class="bl">'+VH(lab)+'</span><span class="bb"><span class="bf" style="width:'+w+'%"></span></span><b class="bn">'+VN(n)+'</b>'+
      (clicky?'</button>':'</div>');
  }).join('');
  if(rs.length>lim) out+='<p class="pnote">'+VN(rs.length-lim)+' more not listed; '+VN(tot)+' in all.</p>';
  if(opts.head) out='<div class="ggrp">'+VH(opts.head)+'</div>'+out;
  return out;
}

function normOps(rows){

function facetList(f,key){
  if(!f||typeof f!=='object') return [];
  var AL={operator:['operators','airlines'],model:['models'],make:['makes','manufacturers'],tail:['tails','aircraft'],part:['parts'],condition:['conditions'],ata:['ata','systems'],jasc:['jasc','systems'],nature:['nature'],crew:['crew','precaution'],discovered:['discovered'],stage:['stage'],zone:['zones','part_location'],corrosion:['corrosion']};
  var names=[key].concat(AL[key]||[]);
  for(var i=0;i<names.length;i++){ var v=f[names[i]];
    if(Array.isArray(v)) return v;
    if(v&&typeof v==='object') return Object.keys(v).map(function(c){ var x=v[c];
      if(x&&typeof x==='object'){ if(x.code==null) x.code=c; return x; }
      return {code:c,label:c,n:x}; });
  }
  return [];
}

function loadPatterns(){
  var b=pbody('p-patterns'); if(!b) return;
  b.innerHTML='<div class="ctl"><div><label for="pt-by">Group the selection by</label><select id="pt-by">'+
    optsHTML([['ata','By system chapter'],['operator','By airline'],['model','By aircraft model'],['part','By part'],['nature','By what was found'],['crew','By what the crew did'],['discovered','By how it was found']])+
    '</select></div></div><div id="pt-trend"><p class="pnote">Counting months…</p></div><div id="pt-brk"></div><div id="pt-phr"></div>';
  vEl('pt-by').addEventListener('change',loadPtBrk);
  var qs=pstr();
  vget('api/trend?'+qs).then(function(d){ paintTrend(vEl('pt-trend'),d); })
    .catch(function(e){ vEl('pt-trend').innerHTML='<p class="pfail">The month-by-month count did not load ('+VH((e&&e.message)||e)+'). No trend is shown.</p>'; });
  loadPtBrk();
  /* The endpoint refuses to compute over-represented vocabulary against the
     whole corpus, and it is right to: every word sits at lift 1.0 there, so the
     answer would be a list of the commonest English in the file dressed as a
     finding. It answers 400 with "narrow the selection first". That is not a
     failure of the page and must not be reported as one. */
  if(!qs){
    vEl('pt-phr').innerHTML='<div class="ggrp">Words that stand out here</div>'+
      '<p class="pnote">Choose something first. Against the whole file every word '+
      'is average by definition, so there is nothing for this to be more common than.</p>';
  } else vget('api/phrases?'+qs).then(function(d){
    var rows=objRows(firstArr(d));
    /* the row is {word, in_selection, corpus, lift}. Read through the generic
       accessors every bar came out at 0. And lift is the finding: 6.7 means the
       word turns up nearly seven times as often here as in the file at large,
       which is what makes it worth searching for. The count alone would rank
       the commonest English in the selection. */
    var mxL=1; rows.forEach(function(r){ var l=+r.lift||0; if(l>mxL)mxL=l; });
    vEl('pt-phr').innerHTML='<div class="ggrp">Words that stand out here</div>'+
      (rows.length?rows.slice(0,18).map(function(r){
        var lab=String(r.word!=null?r.word:rL(r));
        var n=(r.in_selection!=null?r.in_selection:rN(r)), lf=+r.lift||0;
        return '<button type="button" class="brow" data-setk="q" data-setv="'+VH(lab)+'">'+
          '<span class="bl">'+VH(lab)+'</span>'+
          '<span class="bb"><span class="bf" style="width:'+Math.round(100*lf/mxL)+'%"></span></span>'+
          '<b class="bn">'+(lf?VN(Math.round(lf*10)/10)+'\u00d7 ':'')+VN(n)+'</b></button>'; }).join('')
      :'<p class="pnote">No repeated phrases in this selection.</p>');
  }).catch(function(e){ vEl('pt-phr').innerHTML='<p class="pfail">The phrase count did not load ('+VH((e&&e.message)||e)+').</p>'; });
}
/* The reference counts the selection seven ways at once and puts them on one
   page: system, airline, model, part, what was found, what the crew did, how it
   was found. Behind a dropdown a reader sees one of them and has to know to look
   for the rest, which is the difference between a page you read and a form you
   operate. The dropdown is kept, and scrolls to the one it names. */
var PT_ALL=[['ata','Aircraft system'],['operator','Airline'],['model','Model'],
            ['part','Part'],['nature','What was found'],['crew','What the crew did'],
            ['discovered','How it was found']];
function ptOne(by,label){
  var GRP2={ata:'ata',operator:'operator',nature:'nature',crew:'precaution',discovered:'discovered'};
  return vget('api/breakdown?by='+encodeURIComponent(by)+'&'+pstr()).then(function(d){
    var rows=objRows(firstArr(d));
    rows.forEach(function(r){ if(r.label==null){ var c=rC(r), grp=GRP2[by];
      var lab=grp?(by==='ata'?ataLab(c):vcode(grp,c)):null;
      if(!lab&&by==='operator') lab=opLabel(c);
      if(lab) r.label=lab; } });
    rows.sort(function(a,b){ return rN(b)-rN(a); });
    return '<div id="ptb-'+by+'">'+barList(rows,MAPS[by],{head:label,limit:14})+'</div>';
  }).catch(function(e){
    return '<div id="ptb-'+by+'"><div class="ggrp">'+VH(label)+'</div>'+
      '<p class="pfail">This breakdown did not load ('+VH((e&&e.message)||e)+').</p></div>';
  });
}
function loadPtBrk(){
  var box=vEl('pt-brk'); if(!box) return;
  var want=vEl('pt-by')?vEl('pt-by').value:null;
  if(box.dataset.filled==='1'){
    if(want){ var t=document.getElementById('ptb-'+want);
      if(t) t.scrollIntoView({block:'start',behavior:'smooth'}); }
    return;
  }
  box.innerHTML='<p class="pnote">Counting the selection seven ways…</p>';
  Promise.all(PT_ALL.map(function(pr){ return ptOne(pr[0],pr[1]); })).then(function(parts){
    box.innerHTML=parts.join(''); box.dataset.filled='1';
    if(want){ var t=document.getElementById('ptb-'+want);
      if(t) t.scrollIntoView({block:'start',behavior:'smooth'}); }
  });
}
function paintTrend(box,d){
  var rows=objRows(firstArr(d)).map(function(r){ return {m:String(r.month!=null?r.month:rL(r)),n:rN(r)}; })
    .filter(function(x){ return /^\d{4}-\d{2}$/.test(x.m); });
  if(!rows.length){ box.innerHTML='<p class="pnote">The file gives no month spread for this selection.</p>'; return; }
  rows.sort(function(a,b){ return a.m<b.m?-1:1; });
  var max=0,tot=0; rows.forEach(function(r){ max=Math.max(max,r.n); tot+=r.n; });
  var peak=rows.reduce(function(a,b){ return b.n>a.n?b:a; },rows[0]);
  box.innerHTML='<div class="ggrp">Reports per month in your selection — '+VN(tot)+' in all; click a bar to show that month</div>'+
    '<div class="trend">'+rows.map(function(r){ return '<button type="button" class="tb" data-month="'+r.m+'" style="height:'+Math.max(2,Math.round(100*r.n/max))+'%" title="'+VH(monName(r.m))+': '+VN(r.n)+' reports — click to show that month" aria-label="'+VH(monName(r.m))+': '+VN(r.n)+' reports"></button>'; }).join('')+'</div>'+
    '<div class="taxis"><span>'+VH(monName(rows[0].m))+'</span><span>'+VH(monName(rows[rows.length-1].m))+'</span></div>'+
    '<p class="pnote">Busiest month: '+VH(monName(peak.m))+', '+VN(peak.n)+' reports.</p>';
}

function paintAircraft(box,tail,d){

/* --- p-found (follows the filter) --- */
function loadFound(){
  var b=pbody('p-found'); if(!b) return;
  b.innerHTML='<p class="pnote">Counting how the findings in your selection came to light…</p>';
  vget('api/inspection-method?'+pstr()).then(function(d){
    var rows=objRows(firstArr(d));
    var INSTR={B:1,D:1,E:1,M:1,T:1,U:1,X:1}, inst=[],eye=[],tot=0,inn=0;
    rows.forEach(function(r){ var c=String(rC(r)||'').trim(), n=rN(r); tot+=n;
      /* the row carries meaning:{faa,label,note}, so a generic label lookup
         missed it and sixteen methods listed as bare letters: E, U, B. */
      var mn=r.meaning, lb=(mn&&typeof mn==='object')?(mn.label||mn.faa):mn;
      var row={label:String(lb||rL(r)||vcode('discovered',c)||c),code:c,n:n,
               note:(mn&&mn.note)||''};
      if(INSTR[c]){ inst.push(row); inn+=n; } else eye.push(row); });
    var html='';
    if(tot>0){
      html+=statCard(inn,'of your '+VN(tot)+' were found by instrument — not visible from outside the aircraft');
      html+=statCard(tot-inn,'were found by someone looking');
    }
    html+=barList(inst.concat(eye),MAPS.discovered,{limit:14});
    html+='<p class="pnote">Coded B, D, E, M, T, U or X means an instrument found it: a warning went off or a test failed.</p>';
    var st=firstArr((d&&typeof d==='object'&&(d.stages||d.by_stage))||[]);
    if(st.length) html+=barList(st,MAPS.stage,{head:'By stage of flight',limit:10});
    /* systems_most_instrumented is the finding: where damage is most often
       hidden from the eye and has to be found by machine. The panel had it in
       the response and drew none of it. */
    var smi=firstArr(d.systems_most_instrumented);
    if(smi.length){
      html+='<div class="ggrp">Where damage is most often hidden</div>'+
        '<p class="pnote">Systems in which the largest share of finds needed an instrument, so the '+
        'defect was not visible from outside the aircraft.</p>'+
        '<div class="l3wrap"><table class="l3"><tbody>'+
        '<tr><td><b>System</b></td><td><b>Found by instrument</b></td><td><b>Of all reports</b></td>'+
        '<td><b>Share</b></td></tr>'+
        smi.slice(0,12).map(function(r){
          var j=r.jasc||{}, lab=j.label||j.chapter_label||j.code||'';
          var tot2=(r.reports!=null?r.reports:r.total), ins=(r.instrumented!=null?r.instrumented:rN(r));
          var sh=(r.share!=null)?r.share:(tot2?Math.round(1000*ins/tot2)/10:null);
          return '<tr><td>'+VH(lab)+'</td><td>'+VN(ins)+'</td><td>'+(tot2!=null?VN(tot2):'')+
            '</td><td>'+(sh!=null?sh+'%':'')+'</td></tr>';
        }).join('')+'</tbody></table></div>';
    }
    if(d.explainer) html+='<p class="pnote">'+VH(d.explainer)+'</p>';
    b.innerHTML=html;
  }).catch(function(e){ pfail('p-found',(e&&e.message)||e); });
}

function fillFlOp(){
  var s=vEl('fl-op'); if(!s) return;
  /* The facet key is operators, plural, a plain list of designators with
     neither names nor counts. Read as 'operator' it came back empty, so the
     menu listed raw codes alphabetically with (0) beside every airline. The
     controls half already builds this list correctly, with names and in report
     order; copying it keeps the two from drifting apart. */
  var src=document.getElementById('operator');
  if(src && src.options.length>1){
    s.innerHTML='<option value="">Pick an airline code</option>'+
      [].slice.call(src.options,1).map(function(o){

      }).join('');
    return;
  }
  var rows=normOps(facetList(FAC,'operator')).sort(function(a,b){ return (b.n-a.n)||String(a.label).localeCompare(String(b.label)); });
  s.innerHTML='<option value="">Pick an airline code</option>'+rows.map(function(r){
    var lab=(r.label&&r.label!==r.code)?(r.label+' ('+r.code+')'):r.code;
    return '<option value="'+VH(r.code)+'">'+VH(lab)+'</option>';
  }).join('');

    if(m1.length) html+=barList(m1,MAPS.model,{head:'Reports by model',limit:12});

        var t=String(rC(r)||rL(r)).replace(/^N/i,''), lab=rL(r), n=rN(r);

/* --- p-leads --- */
function loadLeads(){
  var b=pbody('p-leads'); if(!b) return;
  b.innerHTML='<div id="ld-leads"><p class="pnote">Reading the whole file for angles…</p></div>'+
    '<div class="ctl"><div><label for="spike-by">Then watch a sudden rise in</label><select id="spike-by">'+
    optsHTML([['ata','By aircraft system'],['part','By part'],['model','By model'],['operator','By airline'],['jasc','By system']])+
    '</select></div></div><div id="ld-spikes"><p class="pnote">Choose a grouping above to look for spikes. Nothing is fetched until you do.</p></div>';
  vEl('spike-by').addEventListener('change',loadSpikes);
  vget('api/leads').then(function(d){
    var rows=objRows(firstArr(d));
    var html=rows.slice(0,20).map(function(r){
      /* a lead is an airframe: {tail, operator, make, model, recent, earlier,
         busiest_day, busiest_day_n, days_filed_on, one_day_burst}. There is no
         title field, so eight cards all read "Lead". The sentence is built from
         what the row actually holds, and says the comparison rather than
         implying a cause. */
      var title, txt;
      if(r.tail||r.model){
        title=(r.tail?"N"+String(r.tail).replace(/^N/i,""):"")+
              (r.model?(r.tail?" \u00b7 ":"")+[r.make,r.model].filter(Boolean).join(" "):"");
        var opName2=(typeof OPNAMES!=="undefined"&&r.operator&&OPNAMES[r.operator])||r.operator||"";
        var bits=[];
        if(r.recent!=null&&r.earlier!=null)
          bits.push(VN(r.recent)+" reports in the last 90 days against "+VN(r.earlier)+" in its whole earlier record");
        if(opName2) bits.push("filed by "+opName2);
        if(r.one_day_burst&&r.busiest_day)
          bits.push(VN(r.busiest_day_n)+" of them on "+r.busiest_day+", so this is one inspection rather than a run of faults");
        else if(r.days_filed_on!=null) bits.push("across "+VN(r.days_filed_on)+" days");
        txt=bits.join(". ")+".";
      }else{
        title=String(r.title||rL(r)||'Lead');
        txt=String(r.text||r.body||r.detail||r.why||'');
      }
      var n=rN(r), acts='';
      if(r.filters&&typeof r.filters==='object'&&!Array.isArray(r.filters)){
        acts=Object.keys(r.filters).map(function(k){
          return '<button type="button" class="ghost" data-setk="'+VH(k)+'" data-setv="'+VH(String(r.filters[k]))+'">Show: '+VH(prettyKey(k))+' '+VH(String(r.filters[k]))+'</button>';
        }).join(' ');
      }
      return '<div class="lead"><h3>'+VH(title)+'</h3>'+(txt?'<p>'+VH(txt)+'</p>':'')+(n?'<p class="lfig">'+VN(n)+' reports</p>':'')+(acts?'<p>'+acts+'</p>':'')+'</div>';
    }).join('');
    vEl('ld-leads').innerHTML='<div class="ggrp">Story leads — computed on every report the FAA has published, not on your selection</div>'+(html||'<p class="pnote">No leads came back.</p>');
  }).catch(function(e){ vEl('ld-leads').innerHTML='<p class="pfail">The leads did not load ('+VH((e&&e.message)||e)+').</p>'; });

function loadEm(){

  out.innerHTML='<p class="pnote">Counting…</p>';
  vget('api/emerging?by='+encodeURIComponent(by)+'&days='+encodeURIComponent(days)).then(function(d){
    var rows=objRows(firstArr(d));
    if(!rows.length){ out.innerHTML='<p class="pnote">Nothing is rising in that window.</p>'; return; }
    var max=0; rows.forEach(function(r){ max=Math.max(max,rN(r)); });
    var map=(by==='partnumber')?null:MAPS[by];  // no P/N filter field exists, so those rows are read-only
    out.innerHTML='<div class="ggrp">New defects — whole file — '+VH(vEl('em-days').selectedOptions[0].textContent.toLowerCase())+'</div>'+
      rows.slice(0,14).map(function(r){
        /* the row is {key, label, recent, earlier, aircraft, operators}: what is
           rising is `recent`, and the whole point is the comparison with
           `earlier`. Read generically every bar came out at 0. */
        var lab=String(r.label||r.key||rL(r)||rC(r)||'');
        var n=(r.recent!=null?r.recent:rN(r));
        var prev=r.previous!=null?r.previous:(r.before!=null?r.before:(r.prior!=null?r.prior:(r.base!=null?r.base:null)));
        var sub=prev!=null?(function(){ var p=Number(prev)||0;
          return 'was '+VN(p)+' in the comparable stretch before — '+(p===n?'no change':(n>p?'up '+VN(n-p):'down '+VN(p-n))); })():'';
        var v=map?(map.v?map.v(r):rC(r)):null, clicky=!!(map&&v);

          '<span class="bl">'+VH(lab)+(sub?'<span class="gsub">'+VH(sub)+'</span>':'')+'</span>'+
          '<span class="bb"><span class="bf" style="width:'+w+'%"></span></span><b class="bn">'+VN(n)+'</b>'+
          (clicky?'</button>':'</div>');
      }).join('');
  }).catch(function(e){ out.innerHTML='<p class="pfail">The emerging list did not load ('+VH((e&&e.message)||e)+').</p>'; });

/* --- p-clusters (min from the API; kind filtered client-side) --- */
function loadClusters(){
  var b=pbody('p-clusters'); if(!b) return;
  b.innerHTML='<div class="ctl"><div><label for="cl-min">At least this many aircraft on one day</label><select id="cl-min">'+
    optsHTML([['3','3 aircraft or more'],['4','4 or more'],['6','6 or more'],['10','10 or more']])+
    '</select></div><div><label for="cl-kind">Kind</label><select id="cl-kind">'+

    '</select></div></div><div id="cl-out"></div>'+
    '<p class="pnote">A heavy check on one aircraft writes many rows: a mechanic files every finding separately. This panel counts aircraft, not rows.</p>';
  vEl('cl-min').addEventListener('change',loadCl); vEl('cl-kind').addEventListener('change',loadCl); loadCl();
}
function loadCl(){
  var min=vEl('cl-min').value, kind=vEl('cl-kind').value, out=vEl('cl-out');
  var render=function(){
    var rows=(CL_ROWS||[]).filter(function(r){
      if(kind==='all') return true;
      /* the flag is looks_routine, a boolean. Reading kind/type/label found
         nothing, so every filter matched everything. */
      var sched=(r.looks_routine!=null)
        ? !!r.looks_routine
        : /sched|recur|plan|check/.test(String(r.kind||r.type||r.label||'').toLowerCase());
      return kind==='sched'?sched:!sched;
    });
    out.innerHTML='<div class="ggrp">One day, many aircraft — whole file, '+VH(vEl('cl-min').selectedOptions[0].textContent.toLowerCase())+'</div>'+
      (rows.length?rows.slice(0,12).map(clusterCard).join(''):'<p class="pnote">No day in the file put that many aircraft on the page at once'+(kind!=='all'?' in this kind':'')+'.</p>');
  };
  if(CL_ROWS&&CL_MIN===min){ render(); return; }
  out.innerHTML='<p class="pnote">Grouping days…</p>';
  vget('api/clusters?min='+encodeURIComponent(min)).then(function(d){
    /* the response is {rows, caveat}: firstArr walked the values and could
       return the caveat string, after which .map threw and the panel reported
       its own crash as the clusters not loading. */
    CL_ROWS=objRows((d&&Array.isArray(d.rows))?d.rows:firstArr(d)); CL_MIN=min; render();
  }).catch(function(e){ out.innerHTML='<p class="pfail">The clusters did not load ('+VH((e&&e.message)||e)+').</p>'; });
}
function clusterCard(r){
  var day=r.date||r.day||r.day_key||'';
  var nAc=r.aircraft!=null?Number(r.aircraft)||0:(r.n_aircraft!=null?Number(r.n_aircraft)||0:rN(r));
  /* the row is {date, operator, aircraft, reports, example_part, jasc{},
     looks_routine, other_days_like_this, tails}. jasc is an object and tails is
     a comma-separated string, not a list, so objRows() got a string and .map
     threw: the panel reported its own crash as the clusters not loading. */
  var bits=[];
  if(r.operator) bits.push('Airline: '+(opLabel(r.operator)||r.operator));
  if(r.jasc) bits.push('System: '+((r.jasc&&(r.jasc.label||r.jasc.chapter_label||r.jasc.code))||r.jasc));
  if(r.example_part) bits.push('For example: '+r.example_part);
  if(r.reports!=null) bits.push(VN(r.reports)+' reports');
  if(r.other_days_like_this) bits.push(VN(r.other_days_like_this)+' other days like this one');
  ['zone','ata','nature','model'].forEach(function(k){ if(r[k]) bits.push(prettyKey(k)+': '+r[k]); });
  var tl=r.tails||r.aircraft_list||r.fleet||[];
  var tails=(typeof tl==='string')
    ? tl.split(/\s*,\s*/).filter(Boolean).map(function(x){return {code:x};})
    : objRows(tl);
  var th=tails.slice(0,12).map(function(t){ var s=String(rC(t)||rL(t)).replace(/^N/i,''); return '<button type="button" class="ghost" data-tail="'+VH(s)+'">N'+VH(s)+'</button>'; }).join(' ');
  var more=tails.length>12?'<span class="pnote">and '+(tails.length-12)+' more aircraft</span>':'';
  return '<div class="lead"><h3>'+(day?VH(pdate(day))+' — ':'')+VN(nAc)+' aircraft on the same day</h3>'+
    (bits.length?'<p>'+VH(bits.join(' · '))+'</p>':'')+(th?'<p>'+th+'</p>':'')+more+'</div>';
}

/* --- p-defect --- */
function loadDefect(){
  var b=pbody('p-defect'); if(!b) return;
  b.innerHTML='<p class="pnote">Grouping identical write-ups across the whole file…</p>';
  vget('api/same-defect').then(function(d){
    var rows=objRows(firstArr(d));
    if(!rows.length){ b.innerHTML='<p class="pnote">No repeated defect stood out.</p>'; return; }
    b.innerHTML='<div class="ggrp">The same defect, many aircraft — whole file</div>'+rows.slice(0,20).map(function(r){
      /* the row is {part_name, part_number, condition, reports, aircraft,
         operators}. With no name field the label fell through to the panel's
         own title, so ten rows all read "Same defect". */
      var lab=[r.part_name, r.part_number?('p/n '+r.part_number):'', r.condition]
                .filter(Boolean).join(' \u00b7 ') || String(rL(r)||rC(r)||'Same defect');
      var n=(r.reports!=null?r.reports:rN(r));
      var ops=r.operators!=null?r.operators:(r.n_operators!=null?r.n_operators:null);

/* --- p-structure --- */
function loadStructure(){
  var b=pbody('p-structure'); if(!b) return;
  b.innerHTML='<p class="pnote">Counting corrosion and cracking across the whole file…</p>';
  vget('api/corrosion').then(function(d){
    d=d||{}; var html='';
    var lv=d.levels||d.by_level||d.corrosion;
    var rows=Array.isArray(lv)?lv:(lv&&typeof lv==='object'?Object.keys(lv).map(function(k){ return {code:k,n:lv[k]}; }):[]);
    /* the row is {level, meaning, reports, aircraft}: the code is in .level and
       the plain words in .meaning, which is null for the levels the FAA does not
       define. Read through the generic accessors the code came back empty and
       nine cards all read "Corrosion level" with no level on them. */
    rows.forEach(function(r){
      var c=String(r.level!=null?r.level:(r.code!=null?r.code:rC(r)));
      /* meaning is null for the levels the FAA does not define and an object
         carrying label and faa for the three it does. */
      var mn=r.meaning, lab=(mn&&typeof mn==='object')?(mn.label||mn.short||mn.faa):mn;
      lab=lab||vcode('corrosion',c)||('Corrosion level '+c);
      var nn=(r.reports!=null?r.reports:rN(r));
      html+=statCard(nn, lab, 'corrosion', c); });
    var cr=d.cracked!=null?d.cracked:(d.with_cracks!=null?d.with_cracks:(d.cracks!=null?d.cracks:null));
    if(cr!=null) html+=statCard(cr,'Cracking recorded','cracked','1');
    if(!html){ var alt=objRows(firstArr(d)); if(alt.length) html=barList(alt,null,{}); }
    if(!html){ b.innerHTML='<p class="pnote">No corrosion or cracking figures came back.</p>'; return; }
    /* The endpoint answers with five sections and the panel used one. It looked
       for by_zone and by_part, which do not exist, and ignored by_operator,
       by_model, cracks_by_model and level3: 194 rows of the reference's panel
       against 12 here. */
    var byOp=firstArr(d.by_operator), byMod=firstArr(d.by_model), cbm=firstArr(d.cracks_by_model);
    if(byOp.length) html+=barList(byOp.map(function(r){

        return {code:r.model, label:r.model+(r.longest_inches?'  \u00b7  longest '+r.longest_inches+' in':''),
                n:+r.cracks||0};
      }),MAPS.model,{head:'Measured cracking, by model',limit:10});

    /* Level 3 obliged the operator to tell the regulator within three days and
       to act across the fleet. Each one is a checkable fact, so the reference
       lists them as records rather than as a number. */
    var l3=firstArr(d.level3);
    if(l3.length){
      html+='<div class="ggrp">Every level 3 finding, '+VN(l3.length)+' of them</div>'+
        '<p class="pnote">Level 3 is an urgent airworthiness concern. The operator had to notify '+
        'the regulator within three days and act across the fleet, which is a checkable fact you '+
        'can put to them.</p><div class="l3wrap"><table class="l3"><tbody>'+
        l3.slice(0,200).map(function(r){
          var dt=String(r.DifficultyDate||'').split('/');
          var when=dt.length===3?(dt[1]+' '+['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+dt[0]]+' '+dt[2]):(r.DifficultyDate||'');
          var op=opLabel(r.OperatorDesignator)||r.OperatorDesignator||'';
          return '<tr><td>'+VH(when)+'</td><td>'+VH(op)+'</td>'+
            '<td>'+VH([r.AircraftMake,r.AircraftModel].filter(Boolean).join(' '))+'</td>'+
            '<td>'+VH(r.PartName||'')+'</td><td>'+VH(r.PartLocation||'')+'</td>'+
            '<td><button type="button" class="ghostbtn" data-case="'+VH(r.OperatorControlNumber||'')+'">Case sheet</button></td></tr>';
        }).join('')+'</tbody></table></div>'+

var TERMLAB={nature:'What was found',precaution:'What the crew did',crew:'What the crew did',discovered:'How it was found',stage:'Stage of flight',part_location:'Where on the aircraft',zone:'Where on the aircraft',corrosion:'Corrosion',condition:'Part condition',jasc:'System (JASC)',ata:'System chapter (ATA)',cracked:'Cracking',minhours:'Airframe age',operator:'Airline',make:'Manufacturer',model:'Model'};
var TERMFIELD={nature:'nature',precaution:'crew',crew:'crew',discovered:'discovered',stage:'stage',part_location:'zone',zone:'zone',corrosion:'corrosion',condition:'condition',jasc:'jasc',ata:'ata',operator:'operator',make:'make',model:'model'};
function loadTerms(){
  var b=pbody('p-terms'); if(!b) return;

  Promise.all([vget('api/glossary').catch(function(){ return null; }), facets().catch(function(){ return null; })]).then(function(res){
    var g=res[0]||((typeof CODES!=='undefined')?CODES:null);

    if(g.codes&&typeof g.codes==='object') g=g.codes;
    var G=normGloss(g), C=countsFromFacets(f), html='';
    var order=[]; Object.keys(TERMLAB).forEach(function(k){ if(G[k]) order.push(k); });
    Object.keys(G).forEach(function(k){ if(order.indexOf(k)<0) order.push(k); });
    order.forEach(function(grp){
      var inner=G[grp]||{}, keys=Object.keys(inner); if(!keys.length) return;
      html+='<div class="ggrp">'+VH(TERMLAB[grp]||prettyKey(grp))+'</div>';
      html+=keys.map(function(c){
        var e=inner[c]||{}; if(typeof e==='string') e={label:e};
        var lab=e.label||e.short||c, faa=e.faa||e.faa_wording||'', note=e.note||e.definition||'';
        var cnt=(C[grp]&&C[grp][c]!=null)?C[grp][c]:(e.n!=null?e.n:null);
        var fld=TERMFIELD[grp];
        return (fld?'<button type="button" class="grow" data-setk="'+fld+'" data-setv="'+VH(String(c))+'">':'<div class="grow">')+
          '<span class="gc">'+VH(c)+'</span>'+
          '<span class="gl"><b>'+VH(lab)+'</b>'+
          (faa&&String(faa).toLowerCase()!==String(lab).toLowerCase()?' <span class="gf">FAA wording: '+VH(faa)+'</span>':'')+
          (note?' <span class="gnote">'+VH(note)+'</span>':'')+'</span>'+
          '<b class="bn">'+(cnt!=null?VN(cnt):'')+'</b>'+(fld?'</button>':'</div>');
      }).join('');
    });
    b.innerHTML=html||'<p class="pnote">No codes came back.</p>';
  });
}
function normGloss(g){
  var out={};
  if(Array.isArray(g)){ g.forEach(function(r){ if(!r||typeof r!=='object') return;
    var grp=r.group||r.grp||'other'; (out[grp]=out[grp]||{})[String(r.code||r.key||r.term||'')]=r; }); return out; }
  Object.keys(g||{}).forEach(function(grp){ var v=g[grp];
    if(Array.isArray(v)){ out[grp]={}; v.forEach(function(r){ if(r&&typeof r==='object') out[grp][String(r.code||r.key||r.term||'')]=r; }); }
    else if(v&&typeof v==='object') out[grp]=v;
  });
  return out;
}
function countsFromFacets(f){
  var out={}; if(!f||typeof f!=='object') return out;
  var alias={precaution:'crew',part_location:'zone'};
  Object.keys(f).forEach(function(k){
    var v=f[k], grp=alias[k]||k;
    function put(code,n){ if(code==null) return; (out[grp]=out[grp]||{})[String(code)]=Number(n)||0; }
    if(Array.isArray(v)) v.forEach(function(r){ if(r&&typeof r==='object') put(r.code!=null?r.code:(r.key!=null?r.key:rL(r)), rN(r)); });
    else if(v&&typeof v==='object') Object.keys(v).forEach(function(c){ var x=v[c];
      if(typeof x==='number') put(c,x); else if(x&&typeof x==='object') put(c,rN(x)); });
  });
  return out;
}

/* ---------- fail-closed, client half ---------- */
function sd2Validate(k,v){
  if(k==="q")return true;
  if(k==="ata")return true;                     /* the one loose end, mirrored from the server */
  if(k==="jasc")return /^\d{4}$/.test(v);
  if(k==="zone")return /^ZONE \d00$/.test(v);
  if(k==="corrosion")return v==="1"||v==="2"||v==="3";
  if(k==="cracked")return v==="1";
  if(k==="minhours")return /^\d+$/.test(v);
  if(k==="tail")return /^N?[0-9A-Z]{1,6}$/i.test(v);
  if(k==="from"||k==="to"){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
    var d=new Date(v+"T00:00:00");
    return !isNaN(d.getTime())&&d.getFullYear()+"-"+sd2Pad(d.getMonth()+1)+"-"+sd2Pad(d.getDate())===v;
  }
  var set=sd2Facets[k];
  if(set&&Object.keys(set).length)return Object.prototype.hasOwnProperty.call(set,v);
  return true;                                  /* cannot judge here: the server still refuses */
}

/* ---------- option lists built from the data, with counts ---------- */
function sd2NormFacets(f){
  /* The endpoint's real shape, checked against the live response rather than
     guessed: operators, makes, conditions and stages are plain arrays of
     strings; ata is [{code,label}]; the per-code counts live under counts.
     The keys are plural and the control ids are singular, so they are aliased
     here rather than in every caller. */
  var ALIAS={operators:"operator",makes:"make",conditions:"condition",
             stages:"stage",ata:"ata",zones:"zone"};
  var out={};
  for(var k in f){
    if(k==="counts"||k==="range"||k==="opgap")continue;
    var m={},it=f[k];
    /* The order these arrive in is the only ordering there is for the fields
       that carry no counts, and an object cannot hold it: JavaScript enumerates
       integer-like keys first, in numeric order, so a part condition filed as
       "19681" jumped ahead of CORRODED at the head of a 3,131-entry menu.
       The position is carried on the entry instead. */
    if(Array.isArray(it))it.forEach(function(o,ix){
      if(o&&typeof o==="object"){var v=o.v||o.value||o.code;if(v!=null)m[v]={label:o.label||v,n:o.n||o.count||0,i:ix};}
      else if(o!=null&&o!=="")m[o]={label:String(o),n:0,i:ix};
    });
    else for(var v in it){var e=it[v];m[v]=typeof e==="object"?{label:e.label||v,n:e.n||e.count||0}:{label:v,n:e};}
    out[ALIAS[k]||k]=m;
  }
  var C=f&&f.counts;
  if(C)for(var g in C){
    var tgt=out[ALIAS[g]||g]||(out[ALIAS[g]||g]={});
    for(var code in C[g]){
      if(tgt[code])tgt[code].n=C[g][code];
      else tgt[code]={label:code,n:C[g][code]};
    }
  }
  return out;
}
function opts(field,emptyLabel,skips){
  var sel=sd2$(field);if(!sel)return;
  var counts=sd2Facets[field]||{},tab=null;
  var ks=sd2CodeKeys[field]||[];
  for(var i=0;i<ks.length;i++){if(sd2CODES&&sd2CODES[ks[i]]){tab=sd2CODES[ks[i]];break;}}
  var all={};
  function add(v){
    if(skips&&skips.indexOf(v)>=0)return;
    /* Where the FAA publishes a closed table of codes, that table is the list:
       corrosion offered 0, 5, 6, 7, 8 and 9 beside its three real levels, and
       the crew menu offered "-", "N" and "P".

       Not for operators. That table is a name cross-reference, not an
       enumeration of valid designators: only 1,214 of the 3,947 that occur are
       in it. Applied there it silently dropped two thirds of the airlines in
       the file, which is a worse fault than the one it fixes. */
    if(CLOSED_TABLE[field]&&tab&&tab[v]==null)return;
    all[v]=counts[v]?counts[v].n:0;
  }
  Object.keys(counts).forEach(add);
  if(tab)Object.keys(tab).forEach(add);
  var arr=Object.keys(all).map(function(v){
    var lab;
    if(tab&&tab[v]!=null)lab=typeof tab[v]==="object"?tab[v].label||v:tab[v];
    else lab=(counts[v]&&counts[v].label)||v;
    /* an airline is named, with its designator in brackets, because the code is
       what a reporter has to quote and the name is what they recognise. */
    if(field==="operator"&&lab&&lab!==v)lab=lab+" ("+v+")";
    var e=counts[v];
    return{v:v,lab:lab,n:all[v],i:(e&&e.i!=null)?e.i:1e9};
  });
  /* The endpoint answers with plain lists for operator, make and condition:
     names in report order, no numbers. Sorting them by a count that is always
     zero threw away the only ordering there was, and every option then read
     "(no reports)" about an airline with tens of thousands. Where counts exist
     they are shown and they sort; where they do not, the order stands and the
     bracket is left off rather than filled with a lie. */
  var haveCounts=arr.some(function(o){return o.n>0;});
  arr.sort(haveCounts
    ? function(a,b){return b.n-a.n||(a.lab<b.lab?-1:1);}
    : function(a,b){return a.i-b.i||(a.lab<b.lab?-1:1);});
  var h='<option value="">'+sd2Esc(emptyLabel)+"</option>";
  arr.forEach(function(o){
    h+='<option value="'+sd2Esc(o.v)+'"'+(haveCounts&&o.n===0?' class="empty"':"")+">"+
       sd2Esc(o.lab)+(haveCounts?" ("+(o.n?sd2Num(o.n):"no reports")+")":"")+"</option>";
  });
  sel.innerHTML=h;
}

/* ---------- chips ---------- */
function decodeShown(k,v){
  switch(k){
    case"q":return"“"+v+"”";
    case"ata":{
      /* the chapter has a name; "ATA[57]" is the lookup written out loud */
      var a=(sd2CODES&&sd2CODES.ata&&sd2CODES.ata[v])||null;
      return (a&&(a.label||a))||("chapter "+v);
    }
    case"tail":return"N"+v;
    case"cracked":return"recorded";
    case"minhours":return sd2Num(+v)+" hours";
    case"from":case"to":return sd2Pretty(v);
    case"operator":{
      /* The names live in the code table from api/glossary, 1,213 of them.
         sd2Facets.operator is built from a plain list of designators with
         no names in it, so its label is the code and the chip read
         "CALA (CALA)" where the reference reads "Continental Airlines Inc
         (CALA)". */
      var t=(sd2CODES&&sd2CODES.operator&&sd2CODES.operator[v])||null;
      var nm=(t&&(t.label||t.short))||null;
      if(!nm){var f=sd2Facets.operator&&sd2Facets.operator[v]; nm=(f&&f.label!==v)?f.label:null;}
      return (nm?nm+" ("+v+")":v);
    }
    default:return String(sd2Code(k,v));
  }
}

  var x=document.createElement("b");x.textContent="x";

function buildChips(){

function clauseList(){

      else if(k==="to"&&!p.get("from"))out.push({k:"to",t:"through "+sd2Pretty(p.get("to"))});

function sd2ShowSug(list,kind){
  var kindNamed=kind!=="";
  var readings=(list||[]).map(function(x){
    if(x.kind==="q"||x.term)
      return{kind:"q",label:x.label||x.term||x.v||"",n:x.n||0,what:"a word in the write-ups",raw:x};
    return{kind:x.kind,label:x.label||x.v||x.value||x.code||"",n:x.n||0,
           what:x.what||WHAT[x.kind]||x.kind,raw:x};
  });
  /* the word reading never appears while browsing: free text has its own field */
  SUG_06=readings.filter(function(x){return x.kind!=="q"&&(x.n>0||kindNamed);});
  var best={};
  SUG_06.forEach(function(x){best[x.kind]=Math.max(best[x.kind]||0,x.n);});
  SUG_06.sort(function(a,b){
    var ka=a.kind==="q"?1:0,kb=b.kind==="q"?1:0;
    if(ka!==kb)return ka-kb;
    if(best[b.kind]!==best[a.kind])return best[b.kind]-best[a.kind];
    if(b.n!==a.n)return b.n-a.n;

       '<span class="sw">'+sd2Esc(o.what)+(o.n?"":" | no report in this file")+"</span><b>"+sd2Num(o.n)+"</b></div>";

function sd2AimKeys(ev){

/* ---------- Take it ---------- */
function aimAtGo(){
  var i=sd2Aim("iAimAt"),kind=sd2Aim("aimKind");
  if(!i)return;
  var raw=i.value.trim();
  if(!raw)return;
  if(kind.value===""){handOff(raw);return;}
  aim_06("…");
  fetch("api/resolve?q="+encodeURIComponent(raw))      /* no kind: EVERY reading considered */
    .then(function(r){return r.ok?r.json():{readings:[]};})
    .then(function(d){sd2AimResolved(raw,(d&&d.readings)||d||[]);})
    .catch(function(){aim_06("the resolver did not answer. Try again.");});
}
function sd2AimResolved(raw,readings){
  var o=[],e=[],word=null;
  readings.forEach(function(x){
    if(x.kind==="q")word=x;
    else if(x.n>0)o.push({kind:x.kind,label:x.label||x.v||x.value||x.code||"",n:x.n,
                          what:x.what||WHAT[x.kind]||x.kind,raw:x});
    else e.push(x);
  });
  var z=sd2$("iAim");sd2Hold=null;z.className="aim_06";z.textContent="";
  if(!o.length&&e.length){
    var it=e[0];
    aimHold_06((it.label||it.v||it.value||raw)+" is a valid "+(KINDLAB_06[it.kind]||it.kind).toLowerCase()+
      ", but this file holds no report for it. It runs from "+sd2Pretty(sd2Range&&sd2Range.from)+" to "+
      sd2Pretty(sd2Range&&sd2Range.to)+".");
    return;
  }
  if(!o.length){
    z.appendChild(document.createTextNode("no month, zone, airline, tail or system is called “"+raw+"”."));
    if(word&&word.n>0){
      var b=document.createElement("button");b.type="button";b.className="aimchoice";
      b.appendChild(document.createTextNode('Search the write-ups for “'+raw+'” instead '));
      var bb=document.createElement("b");bb.textContent=sd2Num(word.n);b.appendChild(bb);
      b.addEventListener("click",function(){handOff(raw);});
      z.appendChild(document.createTextNode(" "));z.appendChild(b);
    }else{
      z.appendChild(document.createTextNode(" No mechanic wrote that word either."));
    }
    return;
  }
  if(o.length===1){takeReading(o[0]);return;}
  /* DELTA is an airline AND a word a mechanic writes: never pick silently */
  z.className="aim_06";z.textContent="";
  z.appendChild(document.createTextNode("“"+raw+"” could mean more than one thing here. Which do you want?"));
  o.forEach(function(op){
    var b=document.createElement("button");b.type="button";b.className="aimchoice";
    b.appendChild(document.createTextNode(op.label+" "));
    var em=document.createElement("em");em.textContent=op.what;b.appendChild(em);
    var bb=document.createElement("b");bb.textContent=sd2Num(op.n);b.appendChild(bb);
    b.addEventListener("click",function(){takeReading(op);});

function takeReading(o){
  sd2CloseSug();

    var f=null,t=null,r=o.raw||{};

    if(r.to||r.b){t=r.to||r.b;}
    if(r.y&&r.m){f=r.y+"-"+sd2Pad(r.m)+"-01";t=r.y+"-"+sd2Pad(r.m)+"-"+sd2Pad(new Date(r.y,r.m,0).getDate());}

(function(){

var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
var CODES={}, JARGON={}, OPNAMES={}, OPGAP="The FAA's record for this report names no operator, so no airline name can be shown.";
var RR_KEYRE=null, RR_STOPS=[], RR_ROWLEN=1;
var LASTMONTH=null, RR_ROWI=0, RR_WU_N=0, RR_LOADED=[], TOTAL_07=0, RR_LASTQS=null, RR_CT=0, RR_MO=0;
var CASE_ORDER=[], CASE_MAP={}, currentCase=null, caseFromLink=false, casePushed=false, lastFocus=null, RR_TRAP=null;

    rrCount=document.getElementById('rr-count'), caseBox=document.getElementById('case-box'),

/* ── small helpers ── */
/* esc: already declared as a const above */

function escAttr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function g(x,names){for(var i=0;i<names.length;i++){var v=x?x[names[i]]:null;if(v!==null&&v!==undefined&&v!=='')return v;}return '';}
function clean(s){var t=document.createElement('textarea');t.innerHTML=s;return t.value;}
function ukDate(s){s=String(s||'');var dp=s.split('/');
  if(dp.length===3){var m=parseInt(dp[0],10),d=parseInt(dp[1],10);if(m>=1&&m<=12)return d+' '+MON[m-1]+' '+dp[2];}
  return s;}
function mKey(s){var dp=String(s||'').split('/');return dp.length===3?dp[2]+'-'+String(dp[0]).padStart(2,'0'):'';}
function dateISO(s){var dp=String(s||'').split('/');return dp.length===3?dp[2]+'-'+String(dp[0]).padStart(2,'0')+'-'+String(dp[1]).padStart(2,'0'):'';}
function getP(k){try{var p=params();if(!p)return '';if(typeof p.get==='function')return p.get(k)||'';var v=p[k];return v==null?'':v;}catch(e){return '';}}
function safeCall(fn){var args=[].slice.call(arguments,1),ok=false;
  try{if(typeof fn==='function'){fn.apply(null,args);ok=true;}}catch(e){}
  if(!ok){try{var f=window[fn];if(typeof f==='function'){f.apply(null,args);ok=true;}}catch(e){}}

function extractRows(d){if(!d)return [];if(Array.isArray(d))return d;
  var k;for(k in {reports:1,rows:1,results:1,items:1,data:1})if(Array.isArray(d[k]))return d[k];

/* ── the four-way decode ── */
window.cc=function(grp,v,field){
  if(v===null||v===undefined||v==='')return '<span class="absent">not recorded</span>';
  var e=CODES[grp+'|'+v]||CODES[v];
  if(!e)return esc(v); /* shown as filed */
  var short=e.label||v;
  var bare=!e.note&&String(e.faa||'').toUpperCase()===String(short).toUpperCase();
  var oc="setFilter('"+(field||grp)+"','"+escAttr(v)+"')";
  if(bare)return '<span class="c dull" onclick="'+oc+'">'+esc(short)+'</span>';
  var rest=[e.faa?'FAA wording: '+e.faa:'',e.note||''].filter(Boolean).join('. ');
  return '<span class="term c" data-t="'+escAttr(v)+'" data-label="'+escAttr(short)+'"'+(rest?' data-tip="'+escAttr(rest)+'"':'')+' onclick="'+oc+'">'+esc(short)+'</span>';
};

/* ── the mechanic's words ── */
function keyRe(){if(RR_KEYRE)return RR_KEYRE;
  var ks=Object.keys(JARGON).sort(function(a,b){return b.length-a.length;}).map(reEsc);
  RR_KEYRE=ks.length?new RegExp('(?<![a-z0-9])('+ks.join('|')+')(?![a-z0-9])','gi'):null;return RR_KEYRE;}
function wrapKeys(root){
  var re=keyRe();if(!re)return;var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){var v=n.nodeValue;re.lastIndex=0;if(!re.test(v))return;re.lastIndex=0;
    var frag=document.createDocumentFragment(),last=0,m;
    while((m=re.exec(v))){
      if(m.index>last)frag.appendChild(document.createTextNode(v.slice(last,m.index)));
      var key=m[1].toLowerCase();
      if(JARGON[key]){var sp=document.createElement('span');sp.className='term';sp.dataset.t=key;sp.textContent=m[1];frag.appendChild(sp);}
      else frag.appendChild(document.createTextNode(m[1]));
      last=m.index+m[0].length;if(m.index===re.lastIndex)re.lastIndex++;
    }
    if(last<v.length)frag.appendChild(document.createTextNode(v.slice(last)));
    if(frag.childNodes.length)n.parentNode.replaceChild(frag,n);});}
window.jargon=function(t){
  if(!t)return '<span class="absent">no write-up recorded</span>';

    .replace(/<P>/gi,'</span><span class="wu-action"><b>What the mechanic did about it</b><br>')
    .replace(/<\/P>/gi,'');

  var box=document.createElement('div');box.innerHTML=s;wrapKeys(box);return box.innerHTML;};
window.quoteText=function(d){

/* ── row cells ── */
function crewCodes(x){return Object.keys(x||{}).filter(function(k){return /^PrecautionaryProcedure/i.test(k);})
  .sort().map(function(k){return x[k];}).filter(function(v){return v!==null&&v!==undefined&&v!=='';});}
